<svg viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="180" fill="#0a0a0a"/>

  <!-- LEFT: release pipeline terminal -->
  <rect x="30" y="26" width="185" height="124" rx="8" fill="#111113" stroke="#222225"/>
  <rect x="30" y="26" width="185" height="16" rx="8" fill="#161618"/><rect x="30" y="36" width="185" height="6" fill="#111113"/>
  <text x="122" y="38" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="7" fill="#a1a1a0">release pipeline</text>
  <text x="42" y="61" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="#a1a1a0">build</text>
  <text x="205" y="61" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="#4ade80">✓</text>
  <text x="42" y="77" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="#a1a1a0">tests</text>
  <text x="205" y="77" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="#4ade80">✓</text>
  <rect x="37" y="84" width="171" height="13" rx="2" fill="#d97757" opacity=".12"/>
  <text x="42" y="94" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="#d97757">council</text>
  <text x="205" y="94" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="#d97757">…<animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/></text>
  <text x="42" y="113" font-family="IBM Plex Mono,monospace" font-size="6" fill="#555">diff · 4,012 lines</text>
  <rect x="42" y="123" width="72" height="2" rx="1" fill="#2c2c30"/>
  <rect x="42" y="131" width="46" height="2" rx="1" fill="#2c2c30"/>

  <!-- ARROW: pipeline -> council -->
  <path d="M221 88 L277 88" stroke="#d97757" stroke-width="1.4" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="7;0" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <polygon points="275,84 283,88 275,92" fill="#d97757"/>

  <!-- CENTER: council block -->
  <rect x="285" y="26" width="235" height="124" rx="8" fill="#111113" stroke="#e8b24a" stroke-width="1.2"/>
  <text x="402" y="48" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="8" font-weight="600" fill="#e8b24a">amicus council run</text>
  <circle cx="352" cy="82" r="5" fill="none" stroke="#4285F4" stroke-width="1" opacity="0">
    <animate attributeName="r" values="5;10" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="352" cy="82" r="4.5" fill="#4285F4"/>
  <text x="352" y="97" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="5.5" fill="#7aafff">gemini</text>
  <circle cx="402" cy="82" r="5" fill="none" stroke="#10a37f" stroke-width="1" opacity="0">
    <animate attributeName="r" values="5;10" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="402" cy="82" r="4.5" fill="#10a37f"/>
  <text x="402" y="97" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="5.5" fill="#10a37f">gpt</text>
  <circle cx="452" cy="82" r="5" fill="none" stroke="#738ADB" stroke-width="1" opacity="0">
    <animate attributeName="r" values="5;10" dur="2.6s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2.6s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="452" cy="82" r="4.5" fill="#738ADB"/>
  <text x="452" y="97" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="5.5" fill="#738ADB">deepseek</text>
  <rect x="299" y="110" width="207" height="16" rx="4" fill="#161618"/>
  <text x="402" y="121" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" fill="#a1a1a0">reviews → cross-review → tally → chair</text>

  <!-- ARROW: council -> verdict -->
  <path d="M526 88 C546 88 550 70 567 70" stroke="#d97757" stroke-width="1.4" stroke-dasharray="4,3">
    <animate attributeName="stroke-dashoffset" values="7;0" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <polygon points="565,66 573,70 565,74" fill="#d97757"/>

  <!-- RIGHT: verdict cards -->
  <rect x="575" y="40" width="195" height="60" rx="6" fill="#111113" stroke="#222225"/>
  <text x="585" y="54" font-family="IBM Plex Mono,monospace" font-size="6" fill="#555">verdict.json</text>
  <rect x="712" y="44" width="46" height="14" rx="3" fill="#4ade80" opacity=".12">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="735" y="54" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" fill="#4ade80">exit 0</text>
  <text x="585" y="74" font-family="IBM Plex Mono,monospace" font-size="8" fill="#d97757">VERDICT: Ship it</text>
  <rect x="585" y="84" width="90" height="2" rx="1" fill="#2c2c30"/>
  <rect x="585" y="91" width="60" height="2" rx="1" fill="#2c2c30"/>
  <g opacity=".45">
    <rect x="575" y="110" width="195" height="46" rx="6" fill="#111113" stroke="#222225"/>
    <rect x="712" y="118" width="46" height="14" rx="3" fill="#e25555" opacity=".12"/>
    <text x="735" y="128" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" fill="#e25555">exit 1</text>
    <text x="585" y="128" font-family="IBM Plex Mono,monospace" font-size="7" fill="#a1a1a0">Fix these first</text>
    <rect x="585" y="138" width="80" height="2" rx="1" fill="#2c2c30"/>
    <rect x="585" y="145" width="52" height="2" rx="1" fill="#2c2c30"/>
  </g>
</svg>
