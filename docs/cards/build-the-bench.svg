  <text x="36" y="97" font-family="IBM Plex Mono,monospace" font-size="5.5" fill="#555">200+ models · one key</text>

  <rect x="24" y="116" width="150" height="42" rx="6" fill="#111113" stroke="#222225"/>
  <use href="#gH" transform="translate(37,126)" stroke="#a1a1a0" stroke-width="1"/>
  <text x="50" y="128.5" font-family="IBM Plex Mono,monospace" font-size="6.5" font-weight="600" letter-spacing="1" fill="#a1a1a0">LOCAL</text>
  <text x="36" y="147" font-family="IBM Plex Mono,monospace" font-size="5.5" fill="#555">ollama · lm studio · no key</text>

  <!-- CENTER: dashed delivery lanes -->
  <path d="M174 28 C240 28 300 30 366 30" stroke="#4285F4" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="14;0" dur="1.2s" repeatCount="indefinite"/></path>
  <path d="M174 46 C260 46 330 60 406 60" stroke="#10a37f" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="14;0" dur="1.3s" repeatCount="indefinite"/></path>
  <path d="M174 80 C260 80 340 90 421 90" stroke="#f5f5f3" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="14;0" dur="1.25s" repeatCount="indefinite"/></path>
  <path d="M174 94 C250 94 330 120 406 120" stroke="#8E75B2" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="14;0" dur="1.35s" repeatCount="indefinite"/></path>
  <path d="M174 138 C240 138 300 150 366 150" stroke="#777777" stroke-opacity=".35" stroke-width="1" stroke-dasharray="4,3"><animate attributeName="stroke-dashoffset" values="14;0" dur="1.2s" repeatCount="indefinite"/></path>

