  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".6s" begin="1.3s" fill="freeze"/>
    <path d="M450 30 L643 69" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" values="10;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M490 60 L637 76" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" values="10;0" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M505 90 L630 84" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" values="10;0" dur="1.25s" repeatCount="indefinite"/></path>
    <path d="M490 120 L638 92" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" values="10;0" dur="1.35s" repeatCount="indefinite"/></path>
    <path d="M450 150 L644 99" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" values="10;0" dur="1.2s" repeatCount="indefinite"/></path>
    <polygon points="-5,-3 0,0 -5,3" transform="translate(648,70) rotate(11.4)" fill="#d97757"/>
    <polygon points="-5,-3 0,0 -5,3" transform="translate(642,77) rotate(6.4)" fill="#d97757"/>
    <polygon points="-5,-3 0,0 -5,3" transform="translate(634,84) rotate(-2.7)" fill="#d97757"/>
    <polygon points="-5,-3 0,0 -5,3" transform="translate(642,91) rotate(-10.8)" fill="#d97757"/>
    <polygon points="-5,-3 0,0 -5,3" transform="translate(648,98) rotate(-14.7)" fill="#d97757"/>
  </g>

  <ellipse cx="688" cy="84" rx="52" ry="20" fill="#17171a" stroke="#2f2f35"/>
  <g><animate attributeName="opacity" values="1;.7;1" dur="3.5s" repeatCount="indefinite"/>
    <path d="M681 75h9l5 5v13h-14z" stroke="#d97757" stroke-width="1" fill="#d97757" fill-opacity=".08" stroke-linejoin="round"/>
    <path d="M690 75v5h5" stroke="#d97757" stroke-width="1" stroke-linejoin="round"/>
    <path d="M685 85h7M685 88h7M685 91h4" stroke="#d97757" stroke-width=".8" stroke-linecap="round"/>
