    <text x="410" y="37" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="5" fill="#555">long context</text>
    <use href="#gK" transform="translate(438,25) scale(.7)" stroke="#555" stroke-width="1.2"/>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".25s" fill="freeze"/>
    <rect x="410" y="48" width="80" height="24" rx="5" fill="#111113" stroke="#10a37f" stroke-width="1"/>
    <text x="450" y="58" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" font-weight="600" fill="#10a37f">gpt</text>
