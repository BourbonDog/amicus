  <text x="688" y="116" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" fill="#555">3, 5, 7 — any bench size</text>

  <!-- FOOTER thesis -->
  <text x="400" y="172" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6.5" fill="#555">different families, different blind spots</text>
