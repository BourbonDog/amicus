  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1s" fill="freeze"/>
    <rect x="370" y="138" width="80" height="24" rx="5" fill="#111113" stroke="#555555" stroke-width="1"/>
    <text x="410" y="148" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" font-weight="600" fill="#a1a1a0">llama3</text>
    <text x="410" y="157" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="5" fill="#555">$0 · private</text>
