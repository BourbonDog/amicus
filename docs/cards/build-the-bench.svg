    <g id="gK" stroke-linecap="round"><circle cx="0" cy="0" r="2"/><path d="M2 0H8M5.2 0V1.8M7.2 0V1.8"/></g>
    <g id="gK2" stroke-linecap="round"><circle cx="0" cy="-2" r="1.8"/><path d="M1.8 -2H7.4M5.4 -2V-0.4"/><circle cx="1.2" cy="2.4" r="1.8"/><path d="M3 2.4H8.6M6.6 2.4V4"/></g>
    <g id="gH" stroke-linecap="round" stroke-linejoin="round"><path d="M-3.4 0.4L0 -2.8L3.4 0.4M-2.3 -0.2V3H2.3V-0.2"/></g>
  </defs>

  <!-- LEFT: three source panels -->
  <rect x="24" y="16" width="150" height="42" rx="6" fill="#111113" stroke="#222225"/>
