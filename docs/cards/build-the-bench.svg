    <rect x="425" y="78" width="80" height="24" rx="5" fill="#111113" stroke="#f5f5f3" stroke-opacity=".55" stroke-width="1"/>
    <text x="465" y="88" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" font-weight="600" fill="#f5f5f3">glm</text>
    <text x="465" y="97" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="5" fill="#555">$0.04/run</text>
    <use href="#gK2" transform="translate(493,85) scale(.7)" stroke="#555" stroke-width="1.2"/>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".75s" fill="freeze"/>
    <rect x="410" y="108" width="80" height="24" rx="5" fill="#111113" stroke="#8E75B2" stroke-width="1"/>
    <text x="450" y="118" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="6" font-weight="600" fill="#8E75B2">qwen</text>
    <text x="450" y="127" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="5" fill="#555">code specialist</text>
