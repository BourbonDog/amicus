  <text x="50" y="28.5" font-family="IBM Plex Mono,monospace" font-size="6.5" font-weight="600" letter-spacing="1" fill="#a1a1a0">DIRECT</text>
  <circle cx="122" cy="26" r="2.2" fill="#4285F4"><animate attributeName="opacity" values="1;.5;1" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
  <circle cx="133" cy="26" r="2.2" fill="#10a37f"><animate attributeName="opacity" values="1;.5;1" dur="2.8s" begin=".3s" repeatCount="indefinite"/></circle>
  <circle cx="144" cy="26" r="2.2" fill="#738ADB"><animate attributeName="opacity" values="1;.5;1" dur="2.8s" begin=".6s" repeatCount="indefinite"/></circle>
  <circle cx="155" cy="26" r="2.2" fill="#8E75B2"><animate attributeName="opacity" values="1;.5;1" dur="2.8s" begin=".9s" repeatCount="indefinite"/></circle>
