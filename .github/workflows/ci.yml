name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        # macOS/node-24 ONLY: jest workers intermittently die with "A jest worker
        # process was terminated by another process: signal=SIGSEGV" — a native
        # crash from unbounded worker heap growth, never a test failure: zero
        # assertions fail and the rerun is green. Three confirmed hits tripped
        # the standing third-occurrence rule:
        #   2026-07-31           — killed the run-cost-unknown.test.js suite
        #   2026-08-04 (PR #100) — killed the update-notice.test.js suite
        #   2026-08-05 (PR #105) — 6466 tests passed; the dead worker alone
        #                          failed 1 suite
        # workerIdleMemoryLimit (jest >= 29) recycles a worker once its idle RSS
        # crosses the limit, so the leak never reaches segfault territory. The
        # include below scopes it to this one leg: everywhere else jest-flags is
        # empty and the test step degrades to a plain `npm test`.
        #
        # FOURTH hit — 2026-08-07 (PR #126), the first WITH the 1GB limit in
        # force: killed tests/utils/gateway-route-audit.test.js while 6791 tests
        # passed and 0 failed; the rerun was green. 1GB was therefore too loose
        # to bound the growth on this runner, so the standing rule's escalation
        # applies and the limit halves to 512MB. A worker recycles sooner (a
        # small wall-clock cost on a leg that was already mid-pack at ~3m59s vs
        # ubuntu's ~3m58s), and the ceiling sits further below whatever RSS the
        # segfault actually occurs at. If a FIFTH hit lands at 512MB, stop
        # halving — the next lever is --maxWorkers on this leg (fewer
        # concurrent heaps), not a smaller idle ceiling.
        #
        # FIFTH hit — 2026-08-27 (PR #221), at 512MB: killed
        # tests/design-tokens-css.test.js while 9110 tests passed and 0 failed;
        # the rerun was green, and the killed suite reads exactly one file
        # (src/design/tokens.css) that the PR never touched. 512MB does not
        # bound the growth either, so per the rule above the lever CHANGES
        # rather than the number: --maxWorkers now caps how many worker heaps
        # exist at once. The idle ceiling stays at 512MB — the rule said stop
        # SHRINKING it, not remove it, and recycling a fat worker is still
        # worth having.
        #
        # Why 1 and not 2 — MEASURED by the "Runner capacity" step below, which
        # was added for exactly this decision (run 33133132477):
        #
        #   macos-latest    cpus=3  mem=8GB   jest-default-workers=2
        #   ubuntu-latest   cpus=4  mem=17GB  jest-default-workers=3
        #   windows-latest  cpus=4  mem=17GB  jest-default-workers=3
        #
        # jest defaults maxWorkers to cpus-1, so on this 3-core runner
        # `--maxWorkers=2` IS the default — it would have been a no-op that
        # looked like a fix and bought a sixth hit. 1 is the only value that
        # reduces anything here. Do not "relax" it to 2 without a new capacity
        # reading showing more cores.
        #
        # The memory column is the other half of the story, and no hit record
        # before this one had it: the afflicted leg has LESS THAN HALF the RAM
        # of the two that have never segfaulted. That is consistent with the
        # unbounded-worker-heap theory and explains why this is macOS-only —
        # though note macos/node-22 shares the same 3 vCPU / 8GB and has never
        # been hit, so memory alone is not sufficient; it takes node 24 too.
        #
        # Cost, also measured on that run: this leg goes ~4m -> 6.5m, making it
        # the slowest in the matrix (next is windows/node-24 at 4.7m). Accepted:
        # a slow green leg beats a fast one that fails a suite at random.
        include:
          - os: macos-latest
            node: 24
            jest-flags: --workerIdleMemoryLimit=512MB --maxWorkers=1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Diagnostic for the macOS/node-24 SIGSEGV escalation above. Jest's
      # default maxWorkers is cpus-1, so whether --maxWorkers actually reduces
      # anything depends on a number no one had measured across five hits.
      # Printing it on every leg costs nothing and means the next escalation
      # decision is made from data.
      - name: Runner capacity
        run: node -e "const o=require('os');console.log('cpus='+o.cpus().length+' mem='+Math.round(o.totalmem()/1e9)+'GB jest-default-workers='+Math.max(1,o.cpus().length-1))"
      - run: npm test -- ${{ matrix.jest-flags }}

  quality:
    name: quality (lint + secret-scan + size-gate + citation-gate + actionlint)
    runs-on: ubuntu-latest
    # The actionlint step retries its download, so a sustained network outage
    # can keep this job busy for ~9 minutes instead of failing fast. Without a
    # bound it would inherit GitHub's 6-hour default. Everything here is a
    # seconds-scale static check, so 15 minutes is headroom, not a tight bound.
    timeout-minutes: 15
    steps:
      # fetch-depth 0 (full history) is REQUIRED by check:citations. A
      # `file.js@<ref>:NNN` provenance citation is verified by reading that file
      # AT that commit, and checkout's default shallow clone does not have the
      # commit at all. The gate skips those checks on a shallow clone rather
      # than failing on them, so THIS is the one job where they are really
      # verified — the test legs stay shallow and cheap on purpose.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run check:sizes
      - run: npm run check:citations
      - run: npm run check:tarball
      # actionlint v1.7.12, fetched as a checksum-verified release asset.
      #
      # This step deliberately does NOT run the upstream installer script
      # (scripts/download-actionlint.bash in the actionlint repo), which pipes
      # `curl -L` straight into `tar xvz` with no --fail, no --retry, no timeout
      # and no checksum, so a partial body becomes an unrecoverable
      # `gzip: stdin: unexpected end of file`. That happened live TWICE IN A ROW
      # on 2026-08-12 (run 31622335985): runner egress died mid-transfer and
      # delivered 107 bytes instead of the ~2.3MB tarball, while the same asset
      # downloaded fine (200, 0.5s) off-runner and GitHub reported all systems
      # operational. It blocked an unrelated PR from merging.
      #
      # So: fetch the pinned asset to a FILE, verify its SHA256 before anything
      # is extracted or executed, and retry the whole attempt with backoff. The
      # installer's only real job was OS/arch detection, which is a constant on
      # ubuntu-latest — dropping it also removes a remote script from the
      # execution chain, which is what closed the supply-chain hole: previously
      # nothing verified the binary we ran.
      #
      # BUMPING: change ACTIONLINT_VERSION and ACTIONLINT_SHA256 together. The
      # digest is the linux_amd64 line of that release's own checksums asset
      # (actionlint_<version>_checksums.txt). Both pins are asserted by
      # tests/scripts/ci-workflow.test.js.
      #
      # ubuntu-latest ships shellcheck preinstalled, so actionlint also
      # shellchecks every `run:` block across all workflows for free — no
      # separate shellcheck install needed here. Verified locally before this
      # landed (actionlint 1.7.12 + shellcheck 0.11.0 Windows binaries): 0
      # findings across all 6 workflows, so no suppression config was needed.
      # If a future change trips a finding that would force an edit to a
      # byte-pinned workflow line (see tests/scripts/*-workflow.test.js and
      # package-manifest.test.js), suppress it narrowly with a checked-in
      # .github/actionlint.yaml (documented per-rule) rather than rewording the
      # pinned line.
      - name: actionlint (lint GitHub Actions workflows)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail

          # The pinned digest is the linux_amd64 asset. If ubuntu-latest ever
          # flips arch, fail with THIS message rather than looping on a checksum
          # mismatch that reads like a compromised download.
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "::error::actionlint pin is linux/amd64 but this runner reports '$arch' — re-pin ACTIONLINT_SHA256 from the release checksums asset."
            exit 1
          fi

          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${file}"
          tarball="${RUNNER_TEMP}/${file}"

          for attempt in 1 2 3; do
            rm -f "$tarball"
            # --fail so an error body never reaches the file, --max-time so a
            # stalled transfer cannot inherit the job timeout, --retry for
            # in-process blips; the outer loop covers what curl itself gives up
            # on. --retry-max-time bounds curl's OWN retry loop: without it, 3
            # internal retries each worth --max-time stack up, and the three
            # outer attempts could hang this step for ~24 minutes on a total
            # outage. With it the worst case is ~9 minutes, then a clear error.
            if curl --fail --location --silent --show-error \
                    --connect-timeout 15 --max-time 120 \
                    --retry 3 --retry-delay 2 --retry-all-errors --retry-max-time 60 \
                    --output "$tarball" "$url" \
              && printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tarball" | sha256sum --check --status; then
              echo "actionlint ${ACTIONLINT_VERSION} tarball verified (attempt ${attempt}/3)"
              break
            fi
            # Byte count is the tell: 107 bytes means truncation, ~2.3MB with a
            # bad digest would mean something far more interesting. Test for the
            # file first — a bare `wc -c < missing` leaks the shell's own
            # "No such file or directory" into the log at exactly the moment
            # someone is trying to read a failure.
            if [ -f "$tarball" ]; then
              bytes="$(wc -c < "$tarball")"
            else
              bytes=0
            fi
            echo "attempt ${attempt}/3 failed: received ${bytes} bytes, wanted sha256 ${ACTIONLINT_SHA256}" >&2
            if [ "$attempt" -eq 3 ]; then
              echo "::error::actionlint download or checksum verification failed 3 times — see the byte counts above."
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint" -version
          "${RUNNER_TEMP}/actionlint" -color

  windows-install-smoke:
    # #35: prove the github:/tarball global install runs IDENTICALLY on Windows
    # (same MCP registration + same two skills as the registry install). This
    # exercises the consumer install path — a packed tarball installed globally,
    # which runs postinstall but NOT prepare (prepare is removed). The runner has
    # no `claude` CLI, so postinstall takes its ~/.claude.json file-edit fallback,
    # which is exactly what scripts/check-global-install.js asserts.
    name: windows install smoke (github:/tarball runs identically)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Pack the consumer tarball (SAFE: pack does not run install scripts, and
      # --ignore-scripts also blocks any pack-time hooks).
      - name: Pack tarball
        run: npm pack --ignore-scripts
      # Real global install of the packed tarball. --omit=optional skips the
      # Electron download (the GUI is non-fatal/optional; we only assert
      # MCP + skills). postinstall runs here and registers everything.
      - name: Global install (runs postinstall)
        shell: bash
        run: npm install -g --omit=optional ./amicus-*.tgz
      # Assert MCP registered + both skills installed, identical to registry.
      - name: Assert identical registration
        run: node scripts/check-global-install.js

  integration:
    # The integration tier (tests/**/*.integration.test.js) is excluded from
    # `npm test` by jest.config.js, so before this job NOTHING watched it and
    # six tests rotted unnoticed behind a dead model alias.
    #
    # This job runs it KEYLESS and on purpose. `npm run test:integration` goes
    # through scripts/run-integration-keyless.js, which strips every provider
    # credential and sandboxes the home directory before spawning jest, so the
    # money-spending E2E suites self-skip and only the free assertions execute
    # (~51 assertions, ~10s, $0).
    #
    # DO NOT ADD SECRETS TO THIS JOB. Paid suites belong on the human-initiated
    # rail in integration-live.yml. The keyless wrapper would scrub any key
    # added here anyway, but the intent is that this job never costs money and
    # never gates a push on a live provider.
    #
    # ubuntu-only for this first landing: the tier is process-spawn heavy and
    # has not yet been proven across the 3x2 matrix the unit job uses.
    name: integration (keyless — paid suites self-skip)
    runs-on: ubuntu-latest
    # Process-spawn-heavy and runs on every push; without this, a hung spawn
    # inherits GitHub's 6-hour default and burns a runner for six hours.
    # Measured wall clock is ~10s, so 15 minutes is generous headroom, not a
    # tight bound.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:integration
