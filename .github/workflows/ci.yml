name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        # macOS/node-24 ONLY: jest workers intermittently die with "A jest worker
        # process was terminated by another process: signal=SIGSEGV" — a native
        # crash from unbounded worker heap growth, never a test failure: zero
        # assertions fail and the rerun is green. Three confirmed hits tripped
        # the standing third-occurrence rule:
        #   2026-07-31           — killed the run-cost-unknown.test.js suite
        #   2026-08-04 (PR #100) — killed the update-notice.test.js suite
        #   2026-08-05 (PR #105) — 6466 tests passed; the dead worker alone
        #                          failed 1 suite
        # workerIdleMemoryLimit (jest >= 29) recycles a worker once its idle RSS
        # crosses the limit, so the leak never reaches segfault territory. The
        # include below scopes it to this one leg: everywhere else jest-flags is
        # empty and the test step degrades to a plain `npm test`.
        include:
          - os: macos-latest
            node: 24
            jest-flags: --workerIdleMemoryLimit=1GB
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test -- ${{ matrix.jest-flags }}

  quality:
    name: quality (lint + secret-scan + size-gate + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm run check:sizes
      - run: npm run check:tarball
      # Pinned to v1.7.7 (bump deliberately). ubuntu-latest ships shellcheck
      # preinstalled, so actionlint also shellchecks every `run:` block across
      # all workflows for free — no separate shellcheck install needed here.
      # Verified locally (actionlint + shellcheck Windows binaries) before this
      # landed: 0 findings across all 5 workflows, so no suppression config
      # was needed. If a future change trips a finding that would force an
      # edit to a byte-pinned workflow line (see tests/scripts/*-workflow.test.js
      # and package-manifest.test.js), suppress it narrowly with a checked-in
      # .github/actionlint.yaml (documented per-rule) rather than rewording
      # the pinned line.
      - name: actionlint (lint GitHub Actions workflows)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  windows-install-smoke:
    # #35: prove the github:/tarball global install runs IDENTICALLY on Windows
    # (same MCP registration + same two skills as the registry install). This
    # exercises the consumer install path — a packed tarball installed globally,
    # which runs postinstall but NOT prepare (prepare is removed). The runner has
    # no `claude` CLI, so postinstall takes its ~/.claude.json file-edit fallback,
    # which is exactly what scripts/check-global-install.js asserts.
    name: windows install smoke (github:/tarball runs identically)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Pack the consumer tarball (SAFE: pack does not run install scripts, and
      # --ignore-scripts also blocks any pack-time hooks).
      - name: Pack tarball
        run: npm pack --ignore-scripts
      # Real global install of the packed tarball. --omit=optional skips the
      # Electron download (the GUI is non-fatal/optional; we only assert
      # MCP + skills). postinstall runs here and registers everything.
      - name: Global install (runs postinstall)
        shell: bash
        run: npm install -g --omit=optional ./amicus-*.tgz
      # Assert MCP registered + both skills installed, identical to registry.
      - name: Assert identical registration
        run: node scripts/check-global-install.js

  integration:
    # The integration tier (tests/**/*.integration.test.js) is excluded from
    # `npm test` by jest.config.js, so before this job NOTHING watched it and
    # six tests rotted unnoticed behind a dead model alias.
    #
    # This job runs it KEYLESS and on purpose. `npm run test:integration` goes
    # through scripts/run-integration-keyless.js, which strips every provider
    # credential and sandboxes the home directory before spawning jest, so the
    # money-spending E2E suites self-skip and only the free assertions execute
    # (~51 assertions, ~10s, $0).
    #
    # DO NOT ADD SECRETS TO THIS JOB. Paid suites belong on the human-initiated
    # rail in integration-live.yml. The keyless wrapper would scrub any key
    # added here anyway, but the intent is that this job never costs money and
    # never gates a push on a live provider.
    #
    # ubuntu-only for this first landing: the tier is process-spawn heavy and
    # has not yet been proven across the 3x2 matrix the unit job uses.
    name: integration (keyless — paid suites self-skip)
    runs-on: ubuntu-latest
    # Process-spawn-heavy and runs on every push; without this, a hung spawn
    # inherits GitHub's 6-hour default and burns a runner for six hours.
    # Measured wall clock is ~10s, so 15 minutes is generous headroom, not a
    # tight bound.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:integration
