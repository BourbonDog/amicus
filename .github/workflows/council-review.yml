name: Council Review

# v2 publishes a REAL adjudicated council verdict. One `amicus council run`
# invocation drives the whole pipeline headlessly — Stage-1 independent
# reviews, anonymized peer cross-review, deterministic tally, and a
# non-Claude chair verdict — and this workflow publishes the result three
# ways: a Council Review check run (Confirmed findings as annotations), a
# sticky PR comment, and the full run directory as an evidence artifact.
# Gating now defaults ON via the fail_on input, at its most permissive
# setting: the check fails ONLY when the chair returns "Fundamental
# rethink". "Fix these first" still passes. Pass fail_on: fix to fail on
# anything short of "Ship it", or fail_on: none for report-only.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      models:
        description: Comma-separated amicus model aliases. Resolved from .github/amicus-ci-aliases.json on the base ref when present, else from the table amicus ships in src/utils/curated-models.js. The pre-flight step fails the run before any spend if a name resolves through neither.
        type: string
        default: 'glm,qwen,gpt,deepseek'
      chair:
        description: Chair model that synthesizes the verdict. Must not sit on the bench — if it appears in models, it is excluded from the bench for the run.
        type: string
        default: 'gemini-pro'
      critic:
        description: Optional critic seat (must be one of the bench models); empty disables it
        type: string
        default: ''
      debate:
        description: Add a Stage-2.5 rebuttal round (defense + re-vote) inside the council run
        type: boolean
        default: false
      fail_on:
        description: 'Gate policy: none (report-only), fix (fail unless the chair says Ship it), rethink (fail only on Fundamental rethink)'
        type: string
        default: 'rethink'
      max_cost:
        description: Whole-run cost ceiling in USD (advisory on cold runners)
        type: string
        default: '2.00'
      diff_cap_bytes:
        description: Max bytes of PR diff fed to the council
        type: string
        # ⚠️ 120000 -> 240000 (owner ruling, 2026-08-15). MEASURED on PR #159: the diff reached
        # 214,978 bytes, so ~44% of it was never fed to the council — and the reviewers could
        # not tell which 44%. Round 4's only MAJOR finding graded a file it said outright was
        # "elided from the diff, so I can only assess it from the description", i.e. it reviewed
        # the PR prose about the code instead of the code. Findings about invisible code look
        # exactly like findings about visible code in the verdict table, which is the real cost.
        # ⚠️ BOTH this and the `||` fallback below must move together — see the note there.
        default: '240000'
      require_label:
        description: Require the council-review label on the PR
        type: boolean
        default: true
    secrets:
      OPENROUTER_API_KEY:
        required: true

concurrency:
  group: council-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  council:
    # Opt-in via label. Fork PRs never receive secrets; the runtime gate below
    # soft-skips in that case rather than failing the check.
    # STRING-SAFE label waiver: on plain pull_request events `inputs.*` is empty,
    # and GitHub's loose equality coerces null→0 and false→0 — a bare
    # loose `== false` comparison on the input would be TRUE on every same-repo
    # PR and bypass the label gate. format() yields '' there ('' != 'false'), so
    # the label is ALWAYS required on pull_request; only workflow_call callers
    # can waive it by passing require_label: false.
    if: >
      github.event.pull_request != null &&
      (format('{0}', inputs.require_label) == 'false' ||
       contains(github.event.pull_request.labels.*.name, 'council-review'))
    runs-on: ubuntu-latest
    # #202 follow-up: 45 -> 75, to buy B53 its reach at `--timeout 16` below.
    # ⚠️ 60 was WRONG and the council caught it (#219, raised independently by
    # glm, gpt and deepseek). The worst case is FOUR leg caps, not three-and-a-
    # backstop: the backstop only kills a leg that produces NOTHING, so a stage-1
    # first attempt that STREAMS is bounded by the leg cap like every other stage.
    # MEASURED on the run that raised it (33093722538): `qwen seat` ran 688.7 s,
    # far past the 480 s the old arithmetic assumed. 4 x 960 s = 64 min, which
    # busts a 60 min cap and CANCELS the job — and the evidence-artifact step is
    # `if: !cancelled()`, so a bust deletes the run-dir artifact. (The spend
    # receipt and the ledger-only upload now run on cancellation — best-effort,
    # issue #220 — but the full forensic record still dies with the runner.)
    # ⚠️ 64 min is a FLOOR: Stage-2 repairs are serial, up to 2 per judge, each
    # bounded by the leg cap. `--max-cost` is what bounds that, not time.
    # Raising this costs NOTHING unless hit — GitHub bills actual wall clock.
    # Pinned as arithmetic in tests/scripts/council-review-workflow.test.js.
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # pull_request events carry empty inputs, so the || fallback IS this
      # repo's own bench. workflow_call callers get the input default above.
      # KEEP THE TWO IN SYNC: changing only the input default above silently
      # leaves every PR on this repo running the old bench, because no
      # pull_request run ever reads it.
      MODELS: ${{ inputs.models || 'glm,qwen,gpt,deepseek' }}
      CHAIR: ${{ inputs.chair || 'gemini-pro' }}
      CRITIC: ${{ inputs.critic || '' }}
      DEBATE: ${{ format('{0}', inputs.debate) }}
      # rethink gates the PR on the chair's strongest verdict only: the check
      # fails when the chair returns "Fundamental rethink", and PASSES on both
      # "Fix these first" and "Ship it". A null chair verdict (parse failure)
      # maps to `neutral` below, not `failure` — a dead chair never hard-fails.
      FAIL_ON: ${{ inputs.fail_on || 'rethink' }}
      MAX_COST: ${{ inputs.max_cost || '2.00' }}
      # ⚠️ THIS is the load-bearing default, not the `default:` under workflow_call.inputs.
      # A `pull_request` trigger supplies no `inputs`, so every automatic council review on a
      # PR takes this `||` branch — editing only the input default would have left the real
      # path at 120000 and looked like a fix that changed nothing.
      DIFF_CAP: ${{ inputs.diff_cap_bytes || '240000' }}
      RUN_DIR: council-run
      # ⚠️ AN EXPERIMENT, running on live council rounds (#202, Lever 2). #202 is
      # the council's frequency record: CI legs die at the 480 s no-output
      # backstop on a heavy time-to-first-token tail. Its one untried
      # cause-level lever is OpenRouter PROVIDER PINNING — OpenRouter fans a
      # model out across several upstreams, and a slow one is indistinguishable
      # from a slow model. This pins ONE bench model (qwen) to ONE upstream and
      # rides the ordinary rounds; it costs no extra spend. Scope note: the pin
      # is on the MODEL ID, and the engine walks up from the session directory,
      # so it governs every call qwen makes in the run — its Stage-1 review, its
      # Stage-1 retry, and its Stage-2 judge leg (which runs in $RUN_DIR/_scratch,
      # a child) alike. No other seat's routing is touched.
      #
      # THE MEASUREMENT IT RIDES ON (PR #265, keyless, on the pinned engine):
      # a per-model `options.provider` block reaches the OpenRouter request body
      # verbatim, and an `opencode.json` written into the PER-CALL directory is
      # live — the engine walks UP from the session directory, so a file in
      # $RUN_DIR reaches a Stage-1 seat, whose call is scoped at $RUN_DIR itself
      # (case R12), and the SAME file still reaches a judge leg, whose call is
      # scoped at $RUN_DIR/_scratch, a child (case R14 — the file sat at the
      # scoped directory and the call at its `_scratch` child, which is exactly
      # the geometry of the scope note above).
      #
      # WHY `only` AND NOT `order`. `only: ["reka"]` leaves exactly one upstream
      # able to serve the leg, which is what makes the result SELF-ATTRIBUTING
      # (see below). It also makes `allow_fallbacks` inert — there is nothing to
      # fall back to. So if reka is down or drops the model, the qwen leg simply
      # FAILS, and its Stage-1 retry runs under the same pin and fails the same
      # way. That is the accepted cost of an attributable measurement.
      #
      # WHAT THE RUN RECORDS: nothing. No amicus artifact names the serving
      # upstream — not run.json, not the spend ledger — which is exactly why the
      # single-upstream form is the only honest one: attribution here is BY
      # CONSTRUCTION, not by a field anyone can read back. And the engine
      # validates none of this: a wrong provider slug ships silently and the leg
      # is refused by OpenRouter. So READ THE FIRST RUN'S LEG ERRORS for a 4xx
      # from OpenRouter before any later run's death counts mean anything — a
      # typo here looks exactly like the stall it is meant to measure.
      #
      # ⚠️ AND SO REACHABILITY IS PINNED, NOT OBSERVED (council #266 r1, A1).
      # Because a run records neither the routing block nor the upstream, a
      # SILENT NO-OP — an engine bump that stops walking up from the session
      # directory, or stops forwarding `options.provider` — would be
      # indistinguishable from a working experiment: the pinned seat would keep
      # dying of the same backstop, and every reading would still assume a pin
      # was in force. The standing check is
      # tests/probe-provider-routing-canary.integration.test.js, which runs the
      # two #265 cases whose geometry is this one's (R12, the Stage-1 seat shape;
      # R14, the judge `_scratch` shape) against a local capture server, keyless
      # and $0, on every push. If that canary goes red, this experiment is
      # measuring nothing and the value should be blanked until it is fixed.
      # Two more guards ride with it: the step below refuses a pin naming a model
      # this run's provisioned alias map does not seat, and the post-run health
      # step warns when a pinned model's leg died.
      #
      # TO TURN IT OFF: blank this value. The step below is skipped, no
      # opencode.json is written, and the council runs exactly as before.
      #
      # THE INVARIANT ("PR code is never executed"). This file lands inside the
      # surface the launch-time agent tripwire polices (verifyAgentRendering /
      # verifyAgentFields, rulings P2-R33/R44/R53): a tree's opencode.json CAN
      # move a council agent's permission rules. Three things hold it: the
      # document carries ONLY the routing key — asserted by the step below at
      # every level of the document, top-level, provider and model entry, each
      # failing the job loudly (the provider level was added after round-1
      # review finding F1, which found `provider.<name>.options.baseURL` passing
      # a models-only gate); scripts/probe-council-agents.js's
      # PROBE_TREE_ROUTING_JSON case MEASURED on this engine that a document of
      # exactly this shape moves no rule, no rule order and none of the fields
      # verifyAgentFields reads; and the tripwire still reads every rendered
      # agent back at launch, so a rendering that did move is refused there.
      COUNCIL_PROVIDER_ROUTING: '{"provider":{"openrouter":{"models":{"qwen/qwen3.8-27b":{"options":{"provider":{"only":["reka"]}}}}}}}'
      # A runner has no user config, so every alias would otherwise resolve from
      # amicus's SHIPPED table (src/utils/curated-models.js :: toDefaultAliases).
      # Pointing the config dir at the workspace lets the provisioning step below
      # place a real alias map here, and puts the spend ledger somewhere uploadable
      # — spend-ledger.js writes it into this same directory.
      # github.workspace, NOT runner.temp: the `runner` context is unavailable in a
      # job-level env block, where it silently expands to '' — making this the
      # filesystem root. actionlint catches it; a local test that sets the variable
      # by hand never can.
      AMICUS_CONFIG_DIR: ${{ github.workspace }}/amicus-cfg
    steps:
      - name: Gate on secret availability (soft-skip fork PRs)
        id: gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENROUTER_API_KEY unavailable (fork PR or unset secret) — council review skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the fail_on input before anything paid runs
        if: steps.gate.outputs.available == 'true'
        run: |
          case "$FAIL_ON" in
            none|fix|rethink) ;;
            *) echo "::error::fail_on must be one of none|fix|rethink (got '${FAIL_ON}')"; exit 1 ;;
          esac

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.available == 'true'
        with:
          node-version: 22

      - name: Install amicus (no checkout — PR code is never executed)
        if: steps.gate.outputs.available == 'true'
        env:
          AMICUS_SKIP_POSTINSTALL: '1'
        run: npm install -g --omit=optional amicus@latest

      - name: Provision the alias map (BASE ref only — never PR-controlled)
        if: steps.gate.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # The base BRANCH, not the head and not the PR's base sha: this map decides
          # which models get paid to run, so a PR must never edit the map used to
          # review that same PR — and GitHub freezes `pull_request.base.sha` at PR
          # creation, so a map change merged to the base branch afterwards never
          # reached an open PR (measured on PR #232: the deepseek pin moved on main
          # in #233, the next round still read the map @48530aea). The branch name
          # resolves to the base's CURRENT tip on every run.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          mkdir -p "$AMICUS_CONFIG_DIR"
          # SHAPE, not just syntax (council A2): a map that parses but carries no
          # usable `aliases` object leaves loadConfig() with nothing and degrades
          # SILENTLY to the shipped table — the failure this step exists to remove.
          cat > validate-map.js <<'VALIDATE'
          const fs = require('fs');
          let map;
          try {
            map = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (err) {
            console.error('::error::alias map is not valid JSON: ' + err.message);
            process.exit(1);
          }
          const aliases = map && map.aliases;
          if (!aliases || typeof aliases !== 'object' || Array.isArray(aliases)) {
            console.error('::error::alias map has no aliases object');
            process.exit(1);
          }
          const names = Object.keys(aliases);
          if (names.length === 0) {
            console.error('::error::alias map declares zero aliases');
            process.exit(1);
          }
          for (const name of names) {
            const id = aliases[name];
            if (typeof id !== 'string' || id.indexOf('/') === -1) {
              console.error("::error::alias '" + name + "' does not map to a fully-qualified model id");
              process.exit(1);
            }
          }
          console.log('alias map validated: ' + names.length + ' alias(es)');
          VALIDATE
          # Fetched over the API rather than read from disk because this workflow
          # never checks out — the same reason the briefing step inlines its JS.
          #
          # 404 is the ONLY tolerated failure (council A1/C2): a workflow_call
          # caller legitimately has no such file. Every other failure — rate limit,
          # auth, 5xx, DNS — FAILS the run. Treating a transient blip as "no map"
          # would swap the bench's models on a network hiccup, which is precisely
          # the silent substitution this workflow exists to eliminate.
          if gh api "repos/${GH_REPO}/contents/.github/amicus-ci-aliases.json?ref=${BASE_REF}" \
               --jq '.content' > alias-map.b64 2> alias-map.err; then
            base64 -d < alias-map.b64 > "$AMICUS_CONFIG_DIR/config.json"
            node validate-map.js "$AMICUS_CONFIG_DIR/config.json" || exit 1
            echo "::notice::alias map provisioned from .github/amicus-ci-aliases.json@${BASE_REF}"
          elif grep -q 'HTTP 404' alias-map.err; then
            rm -f "$AMICUS_CONFIG_DIR/config.json"
            echo "::notice::no .github/amicus-ci-aliases.json on the base ref — using amicus's shipped alias table"
          else
            echo "::error::could not read the alias map and it was NOT a 404 — refusing to fall back to the shipped table silently"
            cat alias-map.err
            exit 1
          fi

      - name: Pre-flight the bench (prints every binding; fails before any spend)
        if: steps.gate.outputs.available == 'true'
        run: |
          # Runs BEFORE the paid step on purpose. A seat that is not a known alias
          # here is dropped by config.js :: classifyCouncilMembers with only a
          # run.json note, so the council would quietly review with a smaller
          # bench. Stop instead. The JS only prints; the shell writes the summary,
          # so no newline escapes have to survive the YAML block scalar.
          #
          # The SAME charter covers the map's `outputBudget` (v4.9.7): a value
          # amicus rejects (a string, a zero, anything non-numeric) makes
          # getOutputBudget() return null, no engine flag is set, and every leg
          # silently reserves the engine's 32000 default with no message anywhere
          # — the identical silent substitution, one key over. `validate-map.js`
          # in the provisioning step above inspects `map.aliases` ONLY, so a
          # malformed budget passes it. A budget ABOVE the ceiling degrades the
          # other way: it lands in full on the rows the engine has no ceiling for
          # and is clamped on the rows that have one, so the run stops reserving
          # one number.
          # ⚠️ NAMED HONESTLY: the budget line is an ECHOED READ-BACK — it reports
          # what amicus read from the file this job's own previous step wrote. It
          # catches a typo in the map. It does NOT prove what went on the wire;
          # spend-ledger.jsonl and run.json :: degrades[].data.reason do that.
          cat > preflight.js <<'PREFLIGHT'
          const { execSync } = require('child_process');
          const path = require('path');
          const root = execSync('npm root -g', { encoding: 'utf8' }).trim();
          const cfg = require(path.join(root, 'amicus', 'src', 'utils', 'config.js'));
          // The LOWEST COLD engine ceiling on this bench, and cold it is shared by
          // TWO rows — the chair (google/gemini-3.1-pro-preview) and
          // deepseek/deepseek-v4-flash-0731 — not by the chair alone. MEASURED on
          // the wire against opencode-ai 1.18.15 with the bare {} descriptors CI
          // registers: the flag at 100000 arrives as max_tokens 65536 on both.
          // A static bound on purpose: a runner has no model-catalog.json, so a
          // check that consulted one would test something CI never sees.
          const COLD_CEILING = 65536;
          const seats = []
            .concat(String(process.env.MODELS || '').split(','))
            .concat([String(process.env.CHAIR || '')])
            .map((s) => s.trim())
            .filter(Boolean);
          const aliases = cfg.getEffectiveAliases();
          let problems = 0;
          for (const seat of Array.from(new Set(seats))) {
            if (seat.indexOf('/') !== -1) {
              console.log(seat + ' -> (full id, no alias lookup)');
              continue;
            }
            const resolved = aliases[seat];
            if (resolved === undefined) {
              console.error("::error::seat '" + seat + "' is not a known alias here — it would be dropped from the bench");
              problems++;
            } else {
              console.log(seat + ' -> ' + resolved);
            }
          }
          const declared = (cfg.loadConfig() || {}).outputBudget;
          const budget = cfg.getOutputBudget();
          if (declared === undefined) {
            // No config.json at all (the tolerated 404 path: a workflow_call
            // caller whose base ref carries no map), or a map that predates the
            // key. Unchanged behaviour, said out loud rather than left blank.
            console.log('outputBudget -> unset (the engine default 32000 governs every leg)');
          } else if (budget === null) {
            console.error('::error::outputBudget ' + JSON.stringify(declared)
              + ' is not a positive number — amicus would set no engine flag and every leg'
              + ' would silently reserve the engine 32000 default');
            problems++;
          } else if (budget > COLD_CEILING) {
            console.error('::error::outputBudget ' + budget + ' is above ' + COLD_CEILING
              + ', the lowest COLD engine ceiling on this bench (shared by the chair'
              + ' google/gemini-3.1-pro-preview and deepseek/deepseek-v4-flash-0731) — those'
              + ' rows would be silently clamped while the others reserve in full');
            problems++;
          } else if (budget !== declared) {
            // normalizeOutputBudget FLOORS a fractional number, so the declared
            // and effective values can differ. Print the one that reaches the wire.
            console.log('outputBudget -> ' + budget + ' (declared ' + JSON.stringify(declared) + ', floored)');
          } else {
            console.log('outputBudget -> ' + budget);
          }
          process.exit(problems ? 1 : 0);
          PREFLIGHT
          set +e
          node preflight.js > bindings.txt
          PF=$?
          set -e
          {
            echo "### Council bench bindings"
            echo
            echo '```'
            cat bindings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat bindings.txt
          exit "$PF"

      - name: Pre-flight the OpenRouter credit (refuses before any seat is dispatched)
        id: credit
        if: steps.gate.outputs.available == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # #256. MEASURED (run 35143585179, 309862bf, 2026-09-16): the key's
          # remaining MONTHLY LIMIT sat below this run's own --max-cost, so
          # OpenRouter refused four of seven legs in 2-3 s ("This request would
          # exceed your available credits given your current in-flight
          # requests"), the once-only Stage-1 retries were spent on those
          # refusals, and the round ended COUNCIL_QUORUM with ONE seat reviewed
          # for $0.003. No existing lever reaches that class: the no-output
          # backstop is irrelevant to an instant refusal, and a second retry
          # would be refused the same way against the other legs' in-flight
          # max_tokens reservations (#218 — the reservation is the multiplier).
          # The only cure is to ask the key what it can afford BEFORE dispatch.
          #
          # FOUR OUTCOMES, and only one stops the job (src/utils/council-credit-preflight.js
          # :: decideCreditPreflight owns the ruling, and is unit-tested per branch
          # in tests/utils/council-credit-preflight.test.js).
          #
          # `remaining` is the MINIMUM of the key's monthly limit and the ACCOUNT
          # BALANCE, over whichever of the two came back as a finite number. The
          # cap alone is not the money: a key reporting limit_remaining null has
          # no cap at all, and on a depleted account that is a REFUSAL, not an
          # `ok`. Both unknown leaves `remaining` unknown, which is a warn.
          #
          #   refuse  -> ::error:: + exit 1, nothing dispatched. Four states, each
          #              one meaning NOTHING can run:
          #                * the key is free tier;
          #                * remaining <= 0;
          #                * remaining < THE CHEAPEST BENCH SEAT'S RESERVATION
          #                  (outputBudget x that row's completion price) — the
          #                  motivating run's own shape. The CHEAPEST, not the
          #                  dearest (council #264 r3, B1+C1): refusing when the
          #                  money cannot fund the DEAREST seat turns a run that
          #                  could have seated its cheap seats, possibly to
          #                  quorum, into zero reviews — the very harm this
          #                  preflight exists to avoid. And the CHAIR is not in
          #                  this figure at all: it runs sequentially AFTER the
          #                  wave, so its price can never stop the bench starting.
          #                * remaining < one cent, which would floor the clamp to
          #                  `--max-cost 0` — a bad ARGUMENT, not a tight budget:
          #                  cli-handlers-council-run.js rejects a non-positive
          #                  ceiling with exit 1 before any budget exists.
          #   warn    -> ::warning:: + exit 0. Either something could not be read
          #              (a probe, the balance, the bench's price, the ceiling) or
          #              refusals are LIKELY while the run is not hopeless:
          #                * remaining < the DEAREST seat -> the dearest seat(s)
          #                  will be refused, but a cheaper quorum may still seat;
          #                * remaining < the SUM of the bench's per-seat
          #                  reservations -> the wave cannot be funded
          #                  concurrently (the sum, not seats x dearest: each seat
          #                  holds its OWN reservation);
          #                * remaining < the CHAIR's reservation -> a clause on
          #                  whatever the bench verdict is, never a refusal.
          #              A blind preflight must never cost the repo a review.
          #   clamp   -> ::warning:: + exit 0, and `effective_max_cost` carries a
          #              SMALLER ceiling. This is a SPEND BOUND ONLY and the
          #              weakest state: any warn outranks it, and the bound still
          #              travels on that warn.
          #   ok      -> ::notice:: + exit 0.
          #
          # ⚠️ WHY A CLAMP AND NOT AN ABORT ON THE CEILING (council #264 r1, B1).
          # Refusing on `remaining < MAX_COST` treats --max-cost as the expected
          # spend. It is a WHOLE-RUN CEILING: the motivating run spent $0.003
          # under a $2.00 ceiling and THREE of its seats reviewed fine with the
          # money already below it, so that rule would have turned a partial round
          # into zero reviews. Capping spend is all the clamp does — it cannot
          # make a per-request reservation affordable, which is why the
          # reservation rule above exists and refuses on its own evidence.
          # ⚠️ NOTHING BUT A REFUSAL MAY FAIL THIS STEP (council #264 r1, finding
          # A1). Every path — including a synchronous throw, an unhandled
          # rejection, a missing or broken module and a renamed export — ends at
          # `finish`, which is the ONLY caller of process.exit.
          # ⚠️ WHAT THIS GUARANTEES AND WHAT IT CANNOT — every DECISION message
          # says it out loud (council #264 r2 read the earlier copy as a promise the
          # probe cannot keep). The step-level messages — bootstrap, a broken or
          # renamed module, a rejected probe, the outer catch, unhandledRejection —
          # report that the check did not RUN, so they make no claim to qualify:
          #   GUARANTEES: refuses before any seat is dispatched when a refusal is
          #   CERTAIN, warns when refusals are LIKELY, and bounds aggregate spend.
          #   CANNOT: it cannot prevent a per-request refusal once seats are
          #   dispatched — reservations are charged concurrently and settle
          #   asynchronously, so the money available to leg four is not knowable
          #   before legs one to three exist.
          # TWO READS, because they are two facts (council #264 r2, HQ2):
          # /api/v1/key reports the KEY's monthly cap, /api/v1/credits the
          # ACCOUNT's balance. A key with no cap at all on a depleted account used
          # to pass as `ok`. The smaller of the two governs; an unanswered balance
          # read is never `ok`.
          # THE RESERVATION, not the aggregate (council #264 r2, HQ1): OpenRouter
          # refuses on ONE request's max_tokens reservation, never on --max-cost.
          # outputBudget x a row's completion price is what THAT seat reserves
          # before it emits a token; below the CHEAPEST of them, nothing can run.
          #
          # The key is passed by env and read from process.env — it is never
          # expanded by the shell and never printed. Only figures are.
          cat > credit-preflight.js <<'CREDIT'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          // The ceiling this job intends. It is also what the paid step uses
          // unless the key's remaining limit clamps it below (finding B1).
          const MAX_COST = process.env.MAX_COST === undefined ? '' : String(process.env.MAX_COST);
          const oneLine = (v) => String((v && v.message) || v).replace(/\s+/g, ' ').slice(0, 300);
          // ONE EXIT POINT. Everything this program can decide — and every way it
          // can FAIL — ends here, which makes three guarantees provable from the
          // text rather than hoped for (council #264 r1, findings A1/B1/C1):
          //   * `effective_max_cost` is written on EVERY path. A path that
          //     skipped it would hand the paid step an empty --max-cost, and
          //     parseFloat('') is NaN — a SILENTLY DISABLED cost gate, the exact
          //     opposite of what the clamp is for.
          //   * the annotation is mirrored into the step summary, so a preflight
          //     that could not run is visible on the run page and not only in the
          //     annotation rail nobody scrolls to.
          //   * ONLY a genuine refusal exits non-zero.
          // The `finished` latch is a belt: in production process.exit really
          // does stop the process, so it can only matter if that ever changes.
          let finished = false;
          const finish = (level, message, effective) => {
            if (finished) { return; }
            finished = true;
            // A newline in the value would open a SECOND output key, and
            // max_cost is a workflow_call input — i.e. caller-controlled.
            const value = String(effective === null || effective === undefined ? MAX_COST : effective)
              .replace(/[\r\n]+/g, ' ');
            // TWO WRITES, TWO TRIES (council #264 r1 round 2). Sharing one
            // `try` let a failed $GITHUB_OUTPUT write still print "Run ceiling
            // in force: $X" — an assertion about a value the paid step never
            // received, i.e. two surfaces disagreeing about the same fact.
            let published = false;
            try {
              if (process.env.GITHUB_OUTPUT) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'effective_max_cost=' + value + '\n');
              }
              published = true;
            } catch (outputErr) {
              console.log('::warning::the credit preflight could not publish effective_max_cost ('
                + oneLine(outputErr) + ') — the paid step falls back to MAX_COST');
            }
            try {
              if (process.env.GITHUB_STEP_SUMMARY) {
                // The ceiling line is a claim about what the PAID STEP will use,
                // so it is printed only when the output write landed — and never
                // on a refusal, which dispatches nothing and leaves no ceiling in
                // force at all.
                const ceilingLine = (published && level !== 'error')
                  ? '\n\nRun ceiling in force: $' + value : '';
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                  '### OpenRouter credit preflight\n\n' + message + ceilingLine + '\n\n');
              }
            } catch (summaryErr) {
              console.log('::warning::the credit preflight could not write the step summary: ' + oneLine(summaryErr));
            }
            const line = '::' + level + '::' + message;
            if (level === 'error') { console.error(line); } else { console.log(line); }
            process.exit(level === 'error' ? 1 : 0);
          };
          // The backstop for a rejection nothing else owns — including one thrown
          // by the success handler below, which the two-arg `.then` deliberately
          // does NOT route to the probe's error path.
          process.on('unhandledRejection', (err) => finish('warning',
            'OpenRouter credit could not be checked — an unhandled rejection: ' + oneLine(err) + '; continuing', null));
          try {
          const root = execSync('npm root -g', { encoding: 'utf8' }).trim();
          // The engine's own default when the provisioned map declares no
          // outputBudget — the same number the bench pre-flight step prints.
          const ENGINE_DEFAULT_OUTPUT_BUDGET = 32000;
          // ONE RESOLUTION SHAPE for both modules (pinned in
          // tests/scripts/council-review-workflow.test.js): a typo in this join
          // is the kind of defect that would otherwise warn green forever.
          //
          // TWO DISTINCT FAILURES, said apart. The ONE-TIME BOOTSTRAP GAP is
          // real (same shape as the scripts/extract-workflow-env.js notice in
          // the briefing step below): this job installs `amicus@latest` from
          // npm, never the PR's code, so the release that ADDS
          // council-credit-preflight.js cannot use it, and the require throws
          // MODULE_NOT_FOUND naming that exact path. But a SyntaxError in a
          // shipped module, a broken transitive require, or a path typo throw
          // here too — and reporting any of those as "not shipped yet" would be
          // a FALSE sentence on a real defect, with the step green forever.
          // So: only a miss of the target path itself is the bootstrap; every
          // other throw names the module and the error. Both still exit 0,
          // because a preflight that cannot run must never block a review.
          const load = (file) => {
            const target = path.join(root, 'amicus', 'src', 'utils', file);
            try {
              return require(target);
            } catch (err) {
              // The module WE asked for must be the one reported missing. A
              // BROKEN TRANSITIVE require inside a shipped module also throws
              // MODULE_NOT_FOUND, and `target` appears in its "Require stack:"
              // — so a mere substring test called that the bootstrap gap too
              // (measured). Node's first line is `Cannot find module '<spec>'`,
              // and the spec for a direct miss is this absolute path.
              const missingTarget = err.code === 'MODULE_NOT_FOUND'
                && String(err.message).indexOf("Cannot find module '" + target + "'") === 0;
              // ONE LINE, BOUNDED (oneLine): a MODULE_NOT_FOUND message carries a
              // multi-line "Require stack:" block, and a workflow command ends at
              // the first newline — the rest would spill into the raw log
              // outside the annotation (measured).
              finish('warning', 'OpenRouter credit could not be checked — '
                + (missingTarget
                  ? 'the installed amicus does not ship src/utils/' + file + ' yet (bootstrap: the runner installs amicus@latest, never this PR)'
                  : 'loading src/utils/' + file + ' failed: ' + oneLine(err))
                + '; continuing', null);
              return {};
            }
          };
          const { checkOpenRouterCredit, checkOpenRouterBalance } = load('openrouter-credit.js');
          const { decideCreditPreflight } = load('council-credit-preflight.js');
          const { resolveBenchIds, priceBenchReservation, fetchOpenRouterModelPrices } = load('council-credit-reservation.js');
          // A RENAMED EXPORT throws nothing at require time — it would reach the
          // call below as `undefined is not a function`, an uncaught TypeError
          // that exits non-zero and blocks the review. Named, warned, exit 0.
          const fns = [checkOpenRouterCredit, checkOpenRouterBalance, decideCreditPreflight,
            resolveBenchIds, priceBenchReservation, fetchOpenRouterModelPrices];
          if (fns.some((f) => typeof f !== 'function')) {
            finish('warning', 'OpenRouter credit could not be checked — the installed amicus does not export checkOpenRouterCredit/decideCreditPreflight from src/utils; continuing', null);
          } else {
          // The SAME alias map this job's own earlier step provisioned: the
          // reservation has to be priced against the ids and the output budget
          // the run will actually use, not against anything amicus ships.
          let map = {};
          try {
            map = JSON.parse(fs.readFileSync(path.join(process.env.AMICUS_CONFIG_DIR || '', 'config.json'), 'utf8')) || {};
          } catch (mapErr) {
            map = {};
          }
          const outputBudget = (typeof map.outputBudget === 'number' && map.outputBudget > 0)
            ? map.outputBudget : ENGINE_DEFAULT_OUTPUT_BUDGET;
          const chair = String(process.env.CHAIR || '').trim();
          // The bench is what launches CONCURRENTLY (the chair is excluded from
          // it by the paid step and runs alone afterwards), but the chair's row
          // still has to be PRICED — it reserves like any other seat.
          const bench = String(process.env.MODELS || '').split(',').map((s) => s.trim()).filter(Boolean).filter((m) => m !== chair);
          // Bench and chair resolved APART (council #264 r3, B1): the chair runs
          // sequentially after the wave, so it is priced and reported but can
          // never gate the bench.
          const bound = resolveBenchIds({ aliases: map.aliases, seats: bench });
          const boundChair = resolveBenchIds({ aliases: map.aliases, seats: chair ? [chair] : [] });
          Promise.all([
            checkOpenRouterCredit(process.env.OPENROUTER_API_KEY),
            checkOpenRouterBalance(process.env.OPENROUTER_API_KEY),
            fetchOpenRouterModelPrices(),
          ]).then((answers) => {
            const credit = answers[0];
            const balance = answers[1];
            const catalog = answers[2];
            const unpriceable = (reason, unpriced) => ({ priced: false, cheapestSeatUsd: null,
              dearestSeatUsd: null, waveUsd: null, chairUsd: null, unpriced: unpriced || [],
              unpricedChair: [], reason });
            const reservation = !catalog.checked
              ? unpriceable('the OpenRouter model catalog could not be read')
              : bound.unresolved.length
                ? unpriceable('these seats resolve to no model id in the provisioned alias map', bound.unresolved)
                : priceBenchReservation({ prices: catalog.prices, benchIds: bound.ids, chairIds: boundChair.ids, outputBudget });
            const d = decideCreditPreflight({ credit, balance, reservation, seats: bench.length }, MAX_COST);
            finish(d.outcome === 'refuse' ? 'error' : (d.outcome === 'ok' ? 'notice' : 'warning'),
              d.message, d.effectiveMaxCost);
          }, (err) => {
            // Every probe resolves on failure by contract; this is the belt for a
            // contract change, and it warns like one.
            finish('warning', 'OpenRouter credit could not be checked — the probe rejected: ' + oneLine(err) + '; continuing', null);
          });
          }
          } catch (err) {
            finish('warning', 'OpenRouter credit could not be checked — the preflight itself failed: ' + oneLine(err) + '; continuing', null);
          }
          CREDIT
          node credit-preflight.js

      - name: Build council briefing from the PR diff
        if: steps.gate.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GH_REPO" > full.diff
          # Feed the council the CODE, not the paperwork. A raw byte prefix of
          # `gh pr diff` lets whatever sorts first eat the whole budget — on #143
          # that was 8 markdown files, and ZERO bytes of src/ reached the bench
          # (its own finding C1 called that a blocker). Spec §9 P0 / ruling R12:
          # exclude non-reviewable paths, order src/ first, pack WHOLE files.
          # Inline JS rather than a repo script because this workflow never
          # checks out, and rather than awk because the test harvests this
          # program and executes it verbatim.
          cat > filter-diff.js <<'FILTER_EOF'
          'use strict';
          const fs = require('fs');
          const [, , diffPath, capRaw] = process.argv;
          const cap = Number(capRaw);
          const raw = fs.readFileSync(diffPath, 'utf8');

          const EXCLUDE = [/^docs\/superpowers\//, /^package-lock\.json$/];
          const PRIORITY = [/^src\//, /^tests\//, /^schemas\//, /^\.github\//, /^bin\//, /^electron\//, /^scripts\//];

          function pathOf(block) {
            const m = block.match(/^diff --git a\/.+? b\/(.+?)$/m);
            return m ? m[1] : null;
          }
          function priorityOf(p) {
            const i = PRIORITY.findIndex((re) => re.test(p));
            return i === -1 ? PRIORITY.length : i;
          }

          const parts = raw.split(/(?=^diff --git )/m).filter((s) => s.trim().length > 0);
          const kept = [];
          const dropped = [];
          let unparseable = 0;
          for (const block of parts) {
            const p = pathOf(block);
            if (p === null) { unparseable++; continue; }
            if (EXCLUDE.some((re) => re.test(p))) { dropped.push(p); continue; }
            kept.push({ p, block, prio: priorityOf(p) });
          }
          kept.sort((a, b) => a.prio - b.prio);

          let out = '';
          const elided = [];
          for (const k of kept) {
            if (Buffer.byteLength(out) + Buffer.byteLength(k.block) > cap) { elided.push(k.p); continue; }
            out += k.block;
          }
          // A single file bigger than the entire budget must not reduce the briefing to
          // nothing — that would read to the bench as "this PR changed no code".
          let headTruncated = null;
          if (out === '' && kept.length > 0) {
            out = Buffer.from(kept[0].block, 'utf8').subarray(0, cap).toString('utf8');
            headTruncated = kept[0].p;
            elided.shift();
          }

          process.stdout.write(out);
          const notes = [];
          if (dropped.length) { notes.push('excluded as non-reviewable: ' + dropped.join(', ')); }
          if (elided.length) { notes.push('elided to fit the byte budget: ' + elided.join(', ')); }
          if (headTruncated) { notes.push('truncated mid-file (larger than the whole budget): ' + headTruncated); }
          if (unparseable) { notes.push('unrecognized diff sections (path not parsed): ' + unparseable); }
          process.stderr.write(notes.join('\n'));
          FILTER_EOF
          node filter-diff.js full.diff "$DIFF_CAP" > capped.diff 2> diff-notes.txt

          # A `run:` block's env vars are DEFINED in the job's `env:` block, which
          # this PR does not change — so it never appears in a diff. On #193 both
          # council rounds unanimously raised a blocker that $GH_REPO / $MODELS /
          # $CHAIR were undefined. They were defined; the definitions simply never
          # reached the bench, and four seats agreed off one shared blind spot.
          # Only workflows whose diff SURVIVED the byte cap are worth annotating.
          # The parser is FETCHED, not inlined (#194 finding B1). This workflow
          # never checks out and amicus — the only package the runner installs —
          # depends on no YAML parser, so there is nothing to require; that real
          # constraint is what forced a hand-rolled scan. Fetching the repo’s own
          # module means ONE source serves both the runner and the unit tests in
          # tests/scripts/extract-workflow-env.test.js, which is what the first
          # version lacked. BASE ref, not head: a PR must not swap the parser that
          # reads its own workflow. Unlike the alias map this is supplementary
          # context, so an absent parser is a notice, not a failed run.
          # ONE-TIME BOOTSTRAP GAP (#194 finding A1/B1, and it is real): the PR that
          # ADDS or MOVES this parser cannot use it, because the base ref predates the
          # file. That PR takes the notice path and gets no env section; every PR after
          # the merge gets the feature. Do not read that first notice as a defect.
          if gh api "repos/${GH_REPO}/contents/scripts/extract-workflow-env.js?ref=${BASE_REF}" \
               --jq '.content' 2>/dev/null | base64 -d > env-context.js && [ -s env-context.js ]; then
            ENV_CTX=1
          else
            ENV_CTX=0
            echo "::notice::scripts/extract-workflow-env.js is not on the base ref — env context skipped"
          fi
          : > env-context.md
          # `while read`, not `for x in $(...)`: word-splitting a command
          # substitution is SC2013, and this step already reads diff-notes.txt
          # with exactly this idiom. The `|| [ -n "$wf" ]` guard keeps a final
          # line that has no trailing newline.
          if [ "$ENV_CTX" = "1" ]; then
            # grep exits 1 on ZERO matches, which is the ordinary case: most PRs
            # touch no workflow. This repo's bare `run:` is `bash -e` (no pipefail),
            # so a pipeline masks that status today — but ONE `shell: bash` line
            # anywhere turns pipefail on, and `-e` then kills the step, losing the
            # ENTIRE briefing on every source-only PR. Measured both ways: `bash -e`
            # exits 0, `bash -eo pipefail` exits 1 with no briefing written.
            # Split so grep’s status is guarded rather than carried by a pipeline.
            grep -oE '^\+\+\+ b/\.github/workflows/[^ ]+\.ya?ml$' capped.diff > wf-raw.txt || true
            sed 's|^+++ b/||' wf-raw.txt | sort -u > wf-list.txt
            while IFS= read -r wf || [ -n "$wf" ]; do
              [ -n "$wf" ] || continue
              slug=$(printf '%s' "$wf" | tr '/' '_')
              # HEAD sha, not base: the bench must see the env block as this PR leaves
              # it. A fork PR head is absent from this repo, so the fetch 404s and the
              # annotation is simply skipped — never a hard failure.
              if gh api "repos/${GH_REPO}/contents/${wf}?ref=${HEAD_SHA}" --jq '.content' 2>/dev/null \
                   | base64 -d > "wf-${slug}" 2>/dev/null && [ -s "wf-${slug}" ]; then
                node env-context.js "$wf" "wf-${slug}" >> env-context.md
              fi
            done < wf-list.txt
          fi
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json body -q .body | head -c 4000)
          # The engine's Stage-1 seat briefing supplies the output contract
          # (findings JSON block) and the anti-sycophancy clause itself — this
          # briefing only frames the material and the review focus.
          {
            echo "Review the following pull request diff for correctness bugs, security"
            echo "issues, and risky design choices. Do NOT nitpick style or formatting."
            echo "Cite every finding against a concrete file shown in the diff, and use a"
            echo "path/to/file.ext:line location whenever the hunk makes the line"
            echo "identifiable. If you find nothing substantive, say so plainly."
            echo
            echo "## PR: ${PR_TITLE}"
            echo "${PR_BODY}"
            echo
            echo "## Diff"
            if [ -s diff-notes.txt ]; then
              echo
              echo "> **Not shown.** The diff below is filtered, not the whole PR. Review only what is"
              echo "> shown and do not guess about anything omitted:"
              while IFS= read -r line || [ -n "$line" ]; do echo "> - ${line}"; done < diff-notes.txt
              echo
            fi
            echo '```diff'
            cat capped.diff
            echo '```'
            if [ -s env-context.md ]; then
              echo
              echo "## Workflow env definitions (context, NOT part of the diff)"
              echo
              echo "> Unchanged by this PR, so absent from the diff above. These blocks define"
              echo "> the variables the changed run: steps reference — treat them as present."
              echo
              cat env-context.md
            fi
          } > briefing.md

      - name: Write the provider-routing experiment into the run directory
        # #202 Lever 2. See the COUNCIL_PROVIDER_ROUTING block in this job's
        # `env:` for what the experiment is, what it rides on, and how to stop
        # it. This step only places the document where the engine will read it:
        # $RUN_DIR is the per-call directory PR #265 case R12 measured as live.
        #
        # It must run BEFORE the paid step below — a file written afterwards
        # reaches nothing — and it writes into $RUN_DIR, which the "Upload
        # evidence artifact" step ships wholesale as `council-run`. That is how
        # a reader of an archived run knows what routing was in force for it:
        # the document travels with the run, not with this file's history.
        #
        # Gated on the secret like every other step in this job: a soft-skipped
        # fork PR must not announce an experiment that no council ran.
        #
        # TRUTHINESS, NOT `!= ''` (round-1 review F5). GitHub's `!=` coerces
        # numerically, so the value `0` — valid JSON, not a valid experiment —
        # compares EQUAL to '' and would skip this step with no annotation at
        # all: exactly the "ran silently as no experiment" degrade the jq gates
        # below exist to prevent. The empty string is the only falsy string, so
        # bare truthiness still skips on a blanked (or absent) value and leaves
        # `0` to be refused loudly below.
        if: ${{ steps.gate.outputs.available == 'true' && env.COUNCIL_PROVIDER_ROUTING }}
        run: |
          # `umask 077`, not a bare mkdir (round-1 review F4). This step now
          # creates council-run/ FIRST, and src/council/run-state.js's
          # `fs.mkdirSync(runDir, { recursive: true, mode: 0o700 })` is a no-op
          # on a directory that already exists — it never chmods — so a bare
          # `mkdir -p` at the runner's 0755 umask would silently downgrade the
          # mode the council code deliberately asks for. The subshell keeps the
          # umask off every later command in this step.
          (umask 077; mkdir -p "$RUN_DIR")
          # VALIDATE BEFORE WRITING. A malformed document is written, ignored by
          # the engine, and then read back later as "the experiment ran and
          # changed nothing" — a silent degrade that would poison every death
          # count taken while it was in force. Loud and dead instead.
          #
          # `type == "object"`, not a bare `jq -e .` (council #266 r1, A5). `0`,
          # `null` and `false` are all VALID JSON and all useless here; a bare
          # `-e` exits 1 on each of them, and the step then reported that as a
          # parse failure — telling a maintainer that the literal text `0` "is
          # not valid JSON", which is false and sends them looking for a typo
          # that is not there. A parse error still lands here (jq exits 2), and
          # one honest message covers both: it is not a JSON object.
          if ! jq -e 'type == "object"' >/dev/null <<< "$COUNCIL_PROVIDER_ROUTING"; then
            echo "::error::COUNCIL_PROVIDER_ROUTING must be a JSON object — it is either unparseable or a scalar/array (0, null, false and \"…\" all land here); nothing was written and no seat was dispatched. Fix the value, or blank it to disable the experiment"
            exit 1
          fi
          # The THREE shape assertions the invariant argument rests on — one per
          # level of the document, because a gate that skips a level asserts
          # nothing about it. The measured claim (PROBE_TREE_ROUTING_JSON) is
          # about a document that carries the routing key and NOTHING else; a
          # document carrying an `agent` block, a prompt or a permission block
          # would sit inside the agent-rendering surface with nothing measured
          # about it at all.
          if ! jq -e 'keys == ["provider"]' >/dev/null <<< "$COUNCIL_PROVIDER_ROUTING"; then
            echo "::error::COUNCIL_PROVIDER_ROUTING carries a top-level key other than 'provider' — refused: the #202 Lever 2 invariant is measured only for a routing-ONLY document"
            exit 1
          fi
          # ⚠️ THE PROVIDER LEVEL, added after round-1 review finding F1. Without
          # it a document could carry `provider.openrouter.options.baseURL`
          # alongside `models` and pass every other assertion here. That is not a
          # hypothetical key: `provider.<name>.options` is the engine's own
          # baseURL/apiKey channel, and it is the exact channel PR #265's rig
          # used to point the engine at its local capture server (digest case
          # R3). A models-only gate never reads the level it sits on.
          if ! jq -e '[.provider[] | keys == ["models"]] | (length > 0) and all' >/dev/null <<< "$COUNCIL_PROVIDER_ROUTING"; then
            echo "::error::every COUNCIL_PROVIDER_ROUTING provider entry must carry 'models' and nothing else (no provider-level options/baseURL/apiKey), and there must be at least one — refused"
            exit 1
          fi
          if ! jq -e '[.provider[].models[] | (keys == ["options"]) and (.options | keys == ["provider"])] | (length > 0) and all' >/dev/null <<< "$COUNCIL_PROVIDER_ROUTING"; then
            echo "::error::every COUNCIL_PROVIDER_ROUTING model entry must carry options.provider and nothing else, and there must be at least one — refused"
            exit 1
          fi
          # ⚠️ THE CONTENTS OF options.provider, added after council #266 r1
          # (B1 major + A2 minor). Every gate above is STRUCTURAL: it asks where
          # the keys sit, never what they say. So `{"options":{"provider":{}}}`
          # — an empty, completely inert routing block — passed every one of
          # them, and the step then announced an "active, attributable pin". So
          # did `{"onlyy":["reka"]}` (a typo OpenRouter ignores) and
          # `{"only":[]}` (a list that permits nothing). Each would leave the
          # seat routed exactly as if there were no experiment, while every
          # later reading of its death counts assumed there was one.
          #
          # The allowlist is the field table from OpenRouter's own provider
          # routing documentation ("The provider object can contain the
          # following fields"), transcribed from the copy saved beside the #265
          # probe on 2026-09-17. It is DATA here rather than a hand-written
          # filter so the workflow test can compare it against that same list
          # and catch drift. RE-CHECK IT WHEN OPENROUTER'S DOCS MOVE.
          if ! jq -e --argjson ok '["allow_fallbacks","data_collection","enforce_distillable_text","ignore","max_price","only","order","preferred_max_latency","preferred_min_throughput","quantizations","require_parameters","sort","zdr"]' '[.provider[].models[].options.provider | (keys | length > 0) and ((keys - $ok) | length == 0)] | (length > 0) and all' >/dev/null <<< "$COUNCIL_PROVIDER_ROUTING"; then
            echo "::error::every COUNCIL_PROVIDER_ROUTING options.provider must be a non-empty object whose keys are all documented OpenRouter provider-routing fields (order, only, ignore, allow_fallbacks, sort, require_parameters, data_collection, zdr, quantizations, max_price, preferred_min_throughput, preferred_max_latency, enforce_distillable_text) — an empty or misspelled block is an inert pin reported as an active one; refused"
            exit 1
          fi
          # The three list-valued fields, when present: a non-empty array of
          # non-empty strings. `only: []` permits nothing and `only: [""]` names
          # nothing, and OpenRouter accepts both silently.
          if ! jq -e '[.provider[].models[].options.provider | to_entries[] | select(.key == "only" or .key == "order" or .key == "ignore") | (.value | type == "array") and (.value | length > 0) and (.value | map(type == "string" and length > 0) | all)] | all' >/dev/null <<< "$COUNCIL_PROVIDER_ROUTING"; then
            echo "::error::COUNCIL_PROVIDER_ROUTING's only/order/ignore must each be a non-empty array of non-empty provider slugs — refused"
            exit 1
          fi
          # THE PINNED IDS MUST BE IDS THIS RUN ACTUALLY SEATS. A pin on a model
          # no alias resolves to is an experiment nobody is running: no leg ever
          # reads it, and every later death count is attributed to a pin that
          # governed nothing. Checked against the map the job PROVISIONED from
          # the base ref a few steps up ($AMICUS_CONFIG_DIR/config.json), not
          # against the repo copy — that file is what the bench resolves from.
          # Gateway form (issue #214): the document's keys are engine model ids,
          # so the gateway prefix is ADDED to them rather than stripped off the
          # map's fully-qualified ids.
          if [ -f "$AMICUS_CONFIG_DIR/config.json" ]; then
            if ! jq -e --slurpfile map "$AMICUS_CONFIG_DIR/config.json" '($map[0].aliases // {} | [.[]]) as $ids | [.provider | to_entries[] | .key as $prov | (.value.models | keys[]) | ($ids | index($prov + "/" + .)) != null] | (length > 0) and all' >/dev/null <<< "$COUNCIL_PROVIDER_ROUTING"; then
              echo "::error::COUNCIL_PROVIDER_ROUTING pins a model id that no alias in this run's provisioned map resolves to — the pin would govern no leg while its results were read as if it did; fix the id or blank the value. Refused"
              exit 1
            fi
          else
            # The documented 404 fallback (no map on the base ref → amicus's
            # shipped table). Warn rather than fail: the experiment must not be
            # the thing that fails a job for a reason that is not about it.
            echo "::warning::#202 Lever 2 — no provisioned alias map, so the pinned model ids could not be checked against this run's bench; the experiment may be governing no leg at all"
          fi
          printf '%s' "$COUNCIL_PROVIDER_ROUTING" > "$RUN_DIR/opencode.json"
          PINNED=$(jq -r '[.provider[].models | keys[]] | join(", ")' <<< "$COUNCIL_PROVIDER_ROUTING")
          # Keyed BY MODEL ID, not `[…] | add` (round-1 review F5, second half):
          # `add` MERGES the per-model routing objects, so with two pins the
          # notice would print one model's `only` list against both ids.
          ROUTING=$(jq -c '[.provider[].models | to_entries[] | {(.key): .value.options.provider}] | add' <<< "$COUNCIL_PROVIDER_ROUTING")
          # ⚠️ WORDED AS A REQUEST, NOT AN OBSERVATION (council #266 r1, A1).
          # This step writes a file; it cannot see a request body, and neither
          # can the run — no amicus artifact records the routing block or the
          # serving upstream. That the file REACHES qwen's calls is a property
          # of the engine, and it is pinned by
          # tests/probe-provider-routing-canary.integration.test.js (probe rows
          # R12/R14, keyless, on every push), not observed here. Saying
          # otherwise would let an engine bump that stopped honouring the file
          # read exactly like a working experiment.
          echo "::notice::#202 Lever 2 — OpenRouter provider routing REQUESTED for ${PINNED}: ${ROUTING}. Written to ${RUN_DIR}/opencode.json and shipped in the council-run evidence artifact. That this file reaches the model's request body is pinned by tests/probe-provider-routing-canary.integration.test.js (probe rows R12/R14), not observed in this run — nothing here records the routing block or the serving upstream. Read this run's leg errors for an OpenRouter 4xx before reading its stalls."

      - name: Run the adjudicated council (amicus council run, headless)
        if: steps.gate.outputs.available == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # ⚠️ EVIDENCE, not a guess (v4.9 W13; measured over the 4.8.1 cycle,
          # 2026-08-24/25). FIVE councils ran in that window. kimi, qwen AND glm
          # each hit `NO_OUTPUT_BACKSTOP` at the 300000 ms default on their FIRST
          # attempt over OpenRouter — session opened, assistant message minted,
          # ZERO tokens inside the window. kimi hard-failed twice (on two
          # different pins, which is why this is NOT a bad-pin problem), qwen
          # twice; glm stalled first-attempt in 3 of the 5 and survived only
          # because its single Stage-1 retry happened to land. #196's verdict was
          # published on a 2-of-4 bench for exactly this reason.
          # ⚠️ CORRECTED (#202, 2026-08-27). This block used to call the class "a
          # provider-side cold start" whose only lever was WAIT. The TTFT probe
          # refutes that: on this egress first tokens are a CONTINUOUS heavy tail
          # — 8.0, 18.2, 64.5, 80.4, 132.8, 155.0, 156.7, 259.5, 275.0, 384.2 s
          # (runs 33030485388 / 33071695196) — with no gap between "fast" and
          # "never". A leg measured at 384.2 s would have been logged as a
          # zero-token black hole under the 300 s default, and a judge that
          # COMPLETED first spoke at 275.0 s. So the window is not waiting out a
          # cold start; it is a cut point placed inside a real distribution.
          # 480000 ms still sits strictly above the 300 s measured failing and
          # strictly below the per-leg `--timeout 16` (960000 ms) set below, so
          # the backstop still fires FIRST and a genuinely silent seat is still
          # reported and retried rather than burning the whole wall clock.
          # A truly silent population does remain (2 legs of 21 produced nothing
          # at all), which is why the backstop stays.
          # SINGLE-SPELLED on purpose: no `workflow_call` input, no
          # `${{ inputs.x || '...' }}` fallback. Adding either creates the
          # two-spellings trap that cb7c90fd walked into with `models` — if you
          # add an input, add its drift test in
          # tests/scripts/council-review-workflow.test.js alongside models/fail_on.
          # Retry POLICY (a second Stage-1 retry, staggered launch) is out of
          # scope here and filed separately as issue #202.
          AMICUS_NO_OUTPUT_BACKSTOP_MS: '480000'
          # #202: B53's shipped 180 s default is INSIDE the distribution above —
          # it killed a glm leg that was streaming and billing ($0.0526 REPORTED,
          # 9,750 in + 8,373 reasoning + 55 out) after `read pending 181s`.
          # src/headless.js already records a measured 190.6 s `task` call as
          # "already longer than B53's 180 s"; that measurement widened the
          # neighbouring settle deferral and left B53 itself alone.
          # Matched to the backstop so a mid-turn gap gets the same patience a
          # first-token gap gets — both are the one egress-latency phenomenon.
          # ⚠️ REACH (this used to record a 120 s reach as an accepted cost; the
          # leg cap was raised to retire it). B53 can only fire for a tool call
          # starting before `legCap - window`, so at the old 600 s cap it covered
          # the first 120 s of a leg and was effectively early-leg only. At 960 s
          # it covers the first 480 s — 4x the reach, and past the point where
          # both observed wedges (`read pending 181s`, `grep pending 180s`) sat.
          # ⚠️ LITERAL full reach is unreachable and the arithmetic says so: reach
          # is `legCap - 480 s` while the worst case carries `2 x legCap` for
          # stage-2 and the chair, which need none of it. Reach grows sublinearly,
          # cost linearly: raising the cap to `--timeout 20` (a 1200 s leg, up from
          # 960 s) would buy 60% reach for an 80 min worst case. The only lever that
          # would give true full reach is a SMALLER
          # window, and that is the one that was killing healthy legs.
          AMICUS_TOOL_CALL_STALL_MS: '480000'
          # #256 / council #264 r1 (B1): the ceiling the credit preflight left in
          # force — the job's MAX_COST normally, or a SMALLER one clamped to what
          # the key's remaining monthly limit can actually fund. Read through an
          # env var and never spliced into the command line as `${{ }}`:
          # `max_cost` is a workflow_call input, so a direct splice would be a
          # script-injection seam.
          EFFECTIVE_MAX_COST: ${{ steps.credit.outputs.effective_max_cost }}
        run: |
          # ⚠️ VALIDATE BEFORE USING OR ECHOING (council #264 r2, HQ3 / finding A2).
          # The ceiling reached a workflow command unvalidated, re-opening the
          # very injection the preflight neutralises one step earlier — max_cost
          # is a workflow_call input, i.e. caller-controlled.
          # The `case` comes FIRST and is the real guard: `grep -E` matches per
          # LINE, so a multi-line value whose first line is `2.00` would sail
          # through a regex alone. `*[!0-9.]*` rejects any character outside the
          # dollar alphabet, newline included, and only then is the shape checked.
          # ⚠️ AND IT MUST BE POSITIVE (council #264 r2, folded minor). `0`, `0.00`
          # and `.0` all satisfy the shape below, so a caller passing
          # max_cost: "0" reached `--max-cost 0` — which cli-handlers-council-run.js
          # rejects with exit 1. That is the exact class the preflight's sub-cent
          # REFUSAL exists to prevent, arriving through the one door the preflight
          # does not control: the caller's own input. The second case arm demands
          # at least one character that is neither a zero nor a dot.
          valid_ceiling() {
            case "$1" in
              ''|*[!0-9.]*) return 1 ;;
              *[!0.]*) ;;
              *) return 1 ;;
            esac
            printf '%s' "$1" | grep -Eq '^[0-9]+(\.[0-9]{1,2})?$'
          }
          # The preflight writes `effective_max_cost` on every path it can reach,
          # but the fallback is what makes an EMPTY value harmless: parseFloat('')
          # is NaN, and createBudget treats a NaN ceiling as "never over budget" —
          # i.e. a silently disabled cost gate.
          CEILING="$EFFECTIVE_MAX_COST"
          if ! valid_ceiling "$CEILING"; then CEILING="$MAX_COST"; fi
          if ! valid_ceiling "$CEILING"; then
            # The offending value is NEVER echoed: printing it IS the injection.
            echo "::error::the run ceiling is not a dollar amount (expected digits with at most two decimals) — fix the max_cost input; no seat was dispatched"
            exit 1
          fi
          if [ "$CEILING" != "$MAX_COST" ]; then
            # Only the VALIDATED value is echoed, and only as a spend bound: the
            # clamp caps aggregate spend and does not prevent a per-request refusal.
            echo "::notice::aggregate spend for this run is capped at \$${CEILING} by the OpenRouter credit preflight — the money left on the key is smaller than this run's ceiling"
          fi
          # The engine pre-flight requires the chair NOT to be a bench seat,
          # and the default inputs overlap (the default bench contains the
          # default chair). Resolve deterministically before any spend: the
          # chair is excluded from the bench, and the run refuses to start if
          # fewer than 2 seats remain.
          BENCH=$(printf '%s' "$MODELS" | tr ',' '\n' | awk -v c="$CHAIR" '$0 != c' | paste -sd, -)
          if [ "$BENCH" != "$MODELS" ]; then
            echo "::notice::chair '$CHAIR' excluded from the bench (the engine requires the chair not to be seated) — bench: '$BENCH'"
          fi
          if [ -z "$BENCH" ]; then SEATS=0; else SEATS=$(printf '%s' "$BENCH" | awk -F, '{print NF}'); fi
          if [ "$SEATS" -lt 2 ]; then
            echo "::error::bench '$BENCH' has fewer than 2 seats after chair exclusion — pass distinct models/chair inputs"
            exit 1
          fi
          ARGS=(--models "$BENCH" --chair "$CHAIR" --prompt-file briefing.md
                --out-dir "$RUN_DIR" --no-validate-model
                --json --max-cost "$CEILING" --timeout 16)
          if [ -n "$CRITIC" ]; then ARGS+=(--critic "$CRITIC"); fi
          if [ "$DEBATE" = "true" ]; then ARGS+=(--debate); fi
          set +e
          amicus council run "${ARGS[@]}" > council-cli.json
          EC=$?
          set -e
          # 0 = full run; 2 = degraded but reportable (fewer than 2 judges,
          # chair failure with overallVerdict null, or the cost ceiling hit
          # after the tally existed). Anything else fails the job.
          if [ "$EC" -ne 0 ] && [ "$EC" -ne 2 ]; then
            echo '::error::council run failed'; cat council-cli.json; exit "$EC"
          fi
          if [ ! -f "$RUN_DIR/verdict.json" ] || [ ! -f "$RUN_DIR/run.json" ]; then
            echo "::error::council run exited $EC but the run dir is missing verdict.json/run.json"
            cat council-cli.json
            exit 1
          fi
          cp council-cli.json "$RUN_DIR/cli-stdout.json"

      - name: Upload the spend ledger alone (cancelled runs only)
        # #229 council B1/D3: on a cancelled run the full evidence upload
        # below never fires, leaving the rendered step summary as the only
        # spend record — human-readable, but not a machine-readable artifact.
        # This ledger-only upload fires ONLY on cancellation (any other
        # outcome already carries the ledger inside the council-run artifact)
        # and ships a single small file, so unlike the full run directory it
        # has a real chance of finishing inside the post-cancellation grace
        # and cannot upload a truncated half-directory. Still best-effort:
        # nothing after a cancellation is guaranteed to run.
        # Ordered FIRST among the post-run steps (#229 round-2 A1/D1): the
        # grace window is shared by every step that runs after a cancellation,
        # so the machine-readable artifact takes the first claim on it instead
        # of queueing behind the receipt's shell block. Costs nothing when not
        # cancelled — the step is skipped instantly.
        if: ${{ cancelled() && steps.gate.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: spend-ledger
          path: ${{ env.AMICUS_CONFIG_DIR }}/spend-ledger.jsonl
          if-no-files-found: warn

      - name: Collect the spend receipt (the only record of concrete model ids)
        # always(), NOT !cancelled() (#220): cancellation is ROUTINE here — the
        # concurrency group cancels on every re-push to a labelled PR, and
        # opening one double-fires (opened + labeled) so the first run is
        # cancelled ~immediately — and it lands AFTER the paid step has
        # launched legs. Under !cancelled() this step was skipped on exactly
        # those runs, making cancellation the one terminal state where a run
        # that spent money left no record of having spent it (a timeout-minutes
        # bust is the same mechanism — a timeout kill is a cancellation).
        # BEST-EFFORT, not guaranteed (#229 council B1/D1): the grace the
        # runner gives always()-gated steps after a cancellation is bounded,
        # and a force-kill skips them. A fast file copy + summary write has
        # the best odds any step can have, which is the most this workflow
        # can do — a guaranteed record needs the engine to write the ledger
        # somewhere durable or emit spend incrementally (issue #220's stated
        # fallback). On a cancelled run the surviving records are the step
        # summary plus the ledger-only artifact above; the full evidence
        # upload stays !cancelled() because a truncated artifact is worse
        # than none. The gate guard stays so fork PRs (nothing provisioned,
        # nothing spent) still skip.
        if: ${{ always() && steps.gate.outputs.available == 'true' }}
        run: |
          # run.json / events.jsonl / verdict.json record ALIAS NAMES only, so they
          # are byte-identical whichever model an alias bound to. The spend ledger
          # is the one artifact carrying fully-resolved ids, and it lands in
          # AMICUS_CONFIG_DIR — which is why that is set to a workspace path above.
          LEDGER="${AMICUS_CONFIG_DIR}/spend-ledger.jsonl"
          mkdir -p "$RUN_DIR"
          if [ -s "$LEDGER" ]; then
            cp "$LEDGER" "$RUN_DIR/spend-ledger.jsonl"
            cat > receipt.js <<'RECEIPT'
          const fs = require('fs');
          const seen = new Map();
          for (const line of fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/)) {
            if (!line.trim()) { continue; }
            let row;
            try { row = JSON.parse(line); } catch (_err) { continue; }
            if (!row || typeof row.model !== 'string') { continue; }
            const cost = (row.cost && Number(row.cost.amount)) || 0;
            const prev = seen.get(row.model) || { calls: 0, cost: 0 };
            seen.set(row.model, { calls: prev.calls + 1, cost: prev.cost + cost });
          }
          for (const entry of seen) {
            console.log(entry[0] + '  (' + entry[1].calls + ' call(s), $' + entry[1].cost.toFixed(4) + ')');
          }
          RECEIPT
            # Guarded, not piped straight into the summary group: a crash inside
            # the group would be masked by the trailing echo's exit status and
            # publish an EMPTY "billed" section — a silent degrade of the very
            # check that exists to prove which models ran.
            if node receipt.js "$LEDGER" > receipt.txt; then
              {
                echo "### Models actually billed"
                echo
                echo '```'
                cat receipt.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::could not summarize the spend ledger (it is still uploaded in the run artifact)"
            fi
          else
            echo "::warning::no spend ledger was written — cannot confirm which models actually ran"
          fi

      - name: Upload evidence artifact (full run directory)
        if: ${{ !cancelled() && steps.gate.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: council-run
          path: council-run/
          if-no-files-found: warn

      - name: Warn when a pinned model's leg died (the #202 Lever 2 experiment may be why)
        # Council #266 r1, A4. `only: ["<one-slug>"]` deliberately removes every
        # fallback, so a pinned upstream that is down, rate-limiting, or has
        # dropped the model takes that seat out of a MERGE-GATING round — and it
        # does so wearing the exact signature the experiment exists to study (a
        # silent leg that dies at the no-output backstop). Nothing distinguished
        # the two, and nobody was told. This step reads the run's own record and
        # says so.
        #
        # ⚠️ WARNING ONLY, NEVER A FAILURE. A dead pinned leg is a DATUM about
        # the experiment, not a reason to fail the PR's gate — that would hand
        # an experiment the power to block merges. `|| true` is the belt; the
        # program's own try/catch is the braces.
        #
        # PLACED AFTER THE EVIDENCE UPLOAD, not straight after the council step:
        # it runs `always()`, so on a cancelled run it competes for the same
        # post-cancellation grace window the #229 ruling gave the ledger upload
        # and the receipt. It is a single local file read, but it still queues
        # behind the two artifacts that ruling put first.
        if: ${{ always() && steps.gate.outputs.available == 'true' && env.COUNCIL_PROVIDER_ROUTING }}
        run: |
          cat > routing-health.js <<'HEALTH'
          const fs = require('fs');
          const path = require('path');
          const read = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return null; } };
          const run = read(path.join(process.env.RUN_DIR, 'run.json'));
          if (!run) {
            // A cancelled or refused run never wrote one. Not a problem to report.
            console.log('::notice::#202 Lever 2 — no run.json, so there is no pinned-leg health to report');
            process.exit(0);
          }
          const map = read(path.join(process.env.AMICUS_CONFIG_DIR || '', 'config.json'));
          const aliases = (map && map.aliases) || {};
          const routing = JSON.parse(process.env.COUNCIL_PROVIDER_ROUTING);
          const degrades = Array.isArray(run.degrades) ? run.degrades : [];
          // A seat is "hurt" when a leg of it ended `error` — whether it was
          // LOST (channel dead-leg) or merely rescued by its once-only retry
          // (channel stage1-retry, whose data.firstFailure records the death).
          // Both are evidence about the pin; only the first costs the round a
          // seat, so the message says which.
          const hurt = (seat) => degrades.filter((d) => {
            const data = (d && d.data) || {};
            const who = data.seat || (data.firstFailure && data.firstFailure.seat);
            if (who !== seat) { return false; }
            return d.channel === 'dead-leg' || data.status === 'error'
              || Boolean(data.firstFailure && data.firstFailure.status === 'error');
          });
          for (const [gateway, block] of Object.entries(routing.provider || {})) {
            for (const [id, entry] of Object.entries((block && block.models) || {})) {
              const full = `${gateway}/${id}`;
              const seats = Object.keys(aliases).filter((a) => aliases[a] === full);
              if (seats.length === 0) {
                console.log(`::warning::#202 Lever 2 — the pin on ${full} matched no alias in this run's map, so its effect on this round cannot be reported; the experiment may be governing no leg`);
                continue;
              }
              for (const seat of seats) {
                const hits = hurt(seat);
                if (hits.length === 0) { continue; }
                const lost = hits.some((d) => d.channel === 'dead-leg');
                const why = hits.map((d) => `${d.channel}: ${d.what}`).join('; ');
                const pin = JSON.stringify(entry && entry.options && entry.options.provider);
                console.log(`::warning::#202 Lever 2 — seat '${seat}' (${full}) ${lost ? 'was LOST from' : 'needed its retry in'} this round, and its OpenRouter upstream was pinned to ${pin} — a single upstream with no fallback, so the pin is a candidate cause and not merely a bystander. ${why}. Check this run's leg errors for an OpenRouter 4xx (a dead or wrong slug looks exactly like the stall this experiment studies), and consider blanking COUNCIL_PROVIDER_ROUTING if it recurs.`);
              }
            }
          }
          HEALTH
          node routing-health.js || true

      - name: Publish the Council Review check run
        if: steps.gate.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Model review text is UNTRUSTED. Before any of it enters the check
          # run (annotation messages, summary), neutralize marker/footer/
          # details forgeries. This is a separate shell from the comment step
          # (the function isn't shared), so the same 5 sed rules are
          # duplicated byte-for-byte here rather than invented anew (the
          # workflow test's sed-rule harvest re-executes every rule in the
          # file and requires identical duplicates).
          neutralize() {
            sed -e 's/<!--[[:space:]]*council-review-sticky[[:space:]]*-->/[model text removed: sticky marker]/gI' \
                -e 's/not an adjudicated/not-an-adjudicated (model text)/gI' \
                -e 's/adjudicated council verdict/adjudicated-council-verdict (model text)/gI' \
                -e 's|<[[:space:]]*/[[:space:]]*details|[/details|gI' \
                -e 's|<[[:space:]]*details|[details|gI'
          }
          OVERALL=$(jq -r 'if .overallVerdict == null then "null" else .overallVerdict end' "$RUN_DIR/verdict.json")
          # Conclusion mapping (spec §10). null is decided BEFORE the gating
          # branches so a chair failure can never fail the check.
          if [ "$FAIL_ON" = "none" ]; then
            CONCLUSION="success"
          elif [ "$OVERALL" = "null" ]; then
            CONCLUSION="neutral"
          elif [ "$FAIL_ON" = "fix" ]; then
            if [ "$OVERALL" = "Ship it" ]; then CONCLUSION="success"; else CONCLUSION="failure"; fi
          else
            if [ "$OVERALL" = "Fundamental rethink" ]; then CONCLUSION="failure"; else CONCLUSION="success"; fi
          fi
          # Confirmed findings, joined with claim/location from tally-input
          # (the tally record strips both; the assembled five-keys object in
          # the run dir still carries the full validated findings). Belt-and-
          # suspenders: a finding withdrawn during debate can never actually
          # reach tier Confirmed (bundleFor excludes withdrawn findings from
          # the re-vote, so a withdrawn finding's tier stays frozen at
          # whatever made it debatable in the first place — Contested or
          # Disputed, never Confirmed) — this select is defensive forward-
          # cover against a future tier-computation change, not load-bearing
          # today.
          jq -c --slurpfile ti "$RUN_DIR/tally-input.json" '
            (($ti[0].findings // []) | map({key: .id, value: .}) | from_entries) as $src
            | [ .findings[] | select(.tier == "Confirmed")
                | select((.debate.action // "") != "withdrawn")
                | . + { claim: (.claim // $src[.id].claim // "(no claim text recorded)"),
                        location: ((.location // $src[.id].location // "") | tostring) } ]
          ' "$RUN_DIR/verdict.json" > confirmed.json
          neutralize < confirmed.json > confirmed-safe.json
          # Best-effort location parse: path:line becomes an inline annotation;
          # a bare path with an extension becomes a file-level fallback
          # (start_line: 1); anything else joins the unmapped list in the
          # check summary.
          jq -c '
            def fileline: [capture("^(?<p>[^\\s:,]+):(?<l>[0-9]+)")?][0];
            def fileonly: [capture("^(?<p>[^\\s:,]+\\.[A-Za-z0-9_]+)")?][0];
            { annotations: [ .[]
                | (.location | fileline) as $fl
                | (.location | fileonly) as $fo
                | if $fl != null then
                    { path: $fl.p, start_line: ($fl.l | tonumber), end_line: ($fl.l | tonumber),
                      annotation_level: "warning",
                      title: ("Council Confirmed " + .id + " [" + .severity + "]"),
                      message: .claim }
                  elif $fo != null then
                    { path: $fo.p, start_line: 1, end_line: 1,
                      annotation_level: "warning",
                      title: ("Council Confirmed " + .id + " [" + .severity + "] (file-level)"),
                      message: .claim }
                  else empty end ],
              unmapped: [ .[]
                | (.location | fileline) as $fl
                | (.location | fileonly) as $fo
                | select($fl == null and $fo == null)
                | ("- **" + .id + "** [" + .severity + "] " + .claim + " _(location: " + (if .location == "" then "none given" else .location end) + ")_") ] }
          ' confirmed-safe.json > check-data.json
          # #202: the seat census rides the TITLE, which is the one line a reader
          # sees without opening anything. `if .seatsReviewed then … else "" end`
          # because the key is emit-when-set — a bare interpolation would publish
          # "seats null/null" on exactly the degraded runs it exists to describe.
          # #242 (v4.9.8): `unverified` rides the same census, printed only when
          # non-zero — jq orders null below every number, so an older verdict.json
          # (no key) and a clean run (0) both print exactly as before.
          # Round 2 (P3-R17): `refused` the same way — a seat that contributed no findings.
          TITLE=$(jq -r --arg v "$OVERALL" '"VERDICT: \($v) — Confirmed \(.tierCounts.Confirmed) · Contested \(.tierCounts.Contested) · Disputed \(.tierCounts.Disputed) · Singleton \(.tierCounts.Singleton)" + (if .seatsReviewed then " · seats \(.seatsReviewed.reviewed)/\(.seatsReviewed.of)" + (if .seatsReviewed.unverified > 0 then " (\(.seatsReviewed.unverified) unverified)" else "" end) + (if .seatsReviewed.refused > 0 then " (\(.seatsReviewed.refused) refused)" else "" end) else "" end)' "$RUN_DIR/verdict.json")
          {
            echo "**Chair verdict:** VERDICT: ${OVERALL}"
            echo
            jq -r '.tierCounts | "| Confirmed | Contested | Disputed | Singleton |\n|---|---|---|---|\n| \(.Confirmed) | \(.Contested) | \(.Disputed) | \(.Singleton) |"' "$RUN_DIR/verdict.json"
            echo
            echo "Gate policy fail_on: ${FAIL_ON} — conclusion: ${CONCLUSION}."
            echo
            if [ "$(jq '.unmapped | length' check-data.json)" -gt 0 ]; then
              echo "**Confirmed findings without a mappable file:line location** (listed here instead of annotated inline):"
              jq -r '.unmapped[]' check-data.json
              echo
            fi
            echo "Full evidence (reviews, judge outputs, tally, verdict, report.html, run.json) is in the council-run artifact: ${RUN_URL}"
          } > check-summary.md
          jq -n --arg sha "$HEAD_SHA" --arg concl "$CONCLUSION" --arg title "$TITLE" --rawfile summary check-summary.md \
            '{name: "Council Review", head_sha: $sha, status: "completed", conclusion: $concl,
              output: {title: $title, summary: $summary}}' > check-create.json
          CHECK_ID=$(gh api "repos/${GH_REPO}/check-runs" -X POST --input check-create.json --jq '.id')
          # The Checks API caps annotations at 50 per request; PATCH the same
          # check run in 50-sized chunks until all are attached.
          ANN_TOTAL=$(jq '.annotations | length' check-data.json)
          i=0
          while [ "$i" -lt "$ANN_TOTAL" ]; do
            jq -c --argjson i "$i" --arg title "$TITLE" --rawfile summary check-summary.md \
              '{output: {title: $title, summary: $summary, annotations: (.annotations[$i:$i+50])}}' \
              check-data.json > check-patch.json
            gh api "repos/${GH_REPO}/check-runs/${CHECK_ID}" -X PATCH --input check-patch.json --jq '.id' > /dev/null
            i=$((i + 50))
          done

      - name: Post sticky PR comment
        if: steps.gate.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- council-review-sticky -->"
          # Model output is UNTRUSTED text. Before it enters the comment,
          # neutralize anything that could (1) forge the sticky marker and
          # hijack the next run's PATCH, (2) forge either footer disclosure
          # phrase (the retired v1 phrase stays covered as defense-in-depth),
          # or (3) open/close <details> and break out of the workflow's own
          # wrappers. The real footer is echoed LAST, after all model text —
          # unforgeable by position. Rules are case-insensitive (I) and
          # whitespace-tolerant: </DETAILS>, < details >, </ details > and
          # <!--council-review-sticky--> bypass exact-string/case-sensitive
          # rules. Openers never match closers (the / is not [[:space:]]).
          neutralize() {
            sed -e 's/<!--[[:space:]]*council-review-sticky[[:space:]]*-->/[model text removed: sticky marker]/gI' \
                -e 's/not an adjudicated/not-an-adjudicated (model text)/gI' \
                -e 's/adjudicated council verdict/adjudicated-council-verdict (model text)/gI' \
                -e 's|<[[:space:]]*/[[:space:]]*details|[/details|gI' \
                -e 's|<[[:space:]]*details|[details|gI'
          }
          OVERALL=$(jq -r 'if .overallVerdict == null then "null" else .overallVerdict end' "$RUN_DIR/verdict.json")
          if [ "$OVERALL" = "null" ]; then
            VERDICT_LINE="**Chair verdict:** unavailable — the chair produced no parseable VERDICT line (overallVerdict: null)"
          else
            VERDICT_LINE="**Chair verdict:** VERDICT: ${OVERALL}"
          fi
          # Per-tier finding lists are model text (claims joined back from
          # tally-input, same join as the check-run step) — neutralized.
          # Withdrawn findings are excluded here too (same clause as the
          # check-run step, but load-bearing here: a debated finding's tier
          # stays frozen pre-debate, so withdrawn Contested/Disputed findings
          # WOULD otherwise render in these lists) — see the comment below,
          # they get their own "Withdrawn in debate" collapsible instead.
          for TIER in Confirmed Contested Disputed Singleton; do
            jq -r --arg tier "$TIER" --slurpfile ti "$RUN_DIR/tally-input.json" '
              (($ti[0].findings // []) | map({key: .id, value: .}) | from_entries) as $src
              | [ .findings[] | select(.tier == $tier)
                  | select((.debate.action // "") != "withdrawn")
                  | "- **\(.id)** [\(.severity)] \((.claim // $src[.id].claim // "(no claim text recorded)")) _(raiser: \(.raiser) · a\(.basis.a)/d\(.basis.d)/n\(.basis.n) · \(.confidence))_" ]
              | if length == 0 then "_none_" else join("\n") end
            ' "$RUN_DIR/verdict.json" > "tier-${TIER}.md"
            neutralize < "tier-${TIER}.md" > "tier-${TIER}-safe.md"
          done
          # Findings withdrawn during the Stage-2.5 debate round: retracted by
          # their own raiser, so they never belong in the tier lists above, but
          # they get their own collapsible for auditability (spec OQ-6). Same
          # claim join as the tier lists; routed through the same neutralize().
          jq -r --slurpfile ti "$RUN_DIR/tally-input.json" '
            (($ti[0].findings // []) | map({key: .id, value: .}) | from_entries) as $src
            | [ .findings[] | select(.debate.action == "withdrawn")
                | "- **\(.id)** [\(.severity)] \((.claim // $src[.id].claim // "(no claim text recorded)")) _(raiser: \(.raiser) · previously: \(.debate.previousTier // "n/a"))_" ]
            | if length == 0 then "_none_" else join("\n") end
          ' "$RUN_DIR/verdict.json" > tier-Withdrawn.md
          neutralize < tier-Withdrawn.md > tier-Withdrawn-safe.md
          STREET=$(jq -r '
            def r2: if . == null then "n/a" else ((. * 100 | round) / 100 | tostring) end;
            ["| Model | peers-only | with-self |", "|---|---|---|"]
            + [ .streetCred[] | "| \(.model) | \(.peersOnly | r2) | \(.withSelf | r2) |" ]
            | join("\n")' "$RUN_DIR/verdict.json")
          TIERS_ROW=$(jq -r '.tierCounts | "| \(.Confirmed) | \(.Contested) | \(.Disputed) | \(.Singleton) |"' "$RUN_DIR/verdict.json")
          # usage.cost is an OBJECT ({amount, source, ...}) — amount is null on
          # unpriced (cold-runner) runs; source says how authoritative it is.
          COST_AMOUNT=$(jq -r '.usage.cost.amount // "unknown"' "$RUN_DIR/run.json")
          COST_SOURCE=$(jq -r '.usage.cost.source // "unknown"' "$RUN_DIR/run.json")
          if [ "$COST_AMOUNT" = "unknown" ]; then
            COST_LINE="run cost: unknown"
          else
            COST_LINE="run cost: \$$(printf '%.4f' "$COST_AMOUNT") (${COST_SOURCE})"
          fi
          STATUS=$(jq -r '"run \(.status) · " + ((.stages // []) | map("\(.name):\(.status)") | join(" → "))' "$RUN_DIR/run.json")
          # #202: `models:` above is the bench that was ASKED FOR. This is how much
          # of it actually reviewed — the fact a reader could not previously get
          # from this comment at all, because `seatLoss` is structurally absent
          # whenever no --critic was requested, and CI never requests one. Carries
          # its own trailing separator so an absent census leaves the footer
          # byte-identical rather than stranding a " · ".
          # #242 (v4.9.8): the unverified count, only when non-zero (see the TITLE note).
          SEATS_LINE=$(jq -r 'if .seatsReviewed then "seats reviewed: \(.seatsReviewed.reviewed) of \(.seatsReviewed.of)" + (if .seatsReviewed.unverified > 0 then " (\(.seatsReviewed.unverified) unverified)" else "" end) + (if .seatsReviewed.refused > 0 then " (\(.seatsReviewed.refused) refused)" else "" end) + " · " else "" end' "$RUN_DIR/verdict.json")
          {
            echo "$MARKER"
            echo "## Council Review (adjudicated — engine v2)"
            echo
            echo "$VERDICT_LINE"
            echo
            echo "| Confirmed | Contested | Disputed | Singleton |"
            echo "|---|---|---|---|"
            echo "$TIERS_ROW"
            echo
            echo "### Confirmed findings"
            cat tier-Confirmed-safe.md
            echo
            echo "<details><summary>Contested findings</summary>"
            echo
            cat tier-Contested-safe.md
            echo
            echo "</details>"
            echo
            echo "<details><summary>Disputed findings</summary>"
            echo
            cat tier-Disputed-safe.md
            echo
            echo "</details>"
            echo
            echo "<details><summary>Singleton findings</summary>"
            echo
            cat tier-Singleton-safe.md
            echo
            echo "</details>"
            echo
            echo "<details><summary>Withdrawn in debate</summary>"
            echo
            cat tier-Withdrawn-safe.md
            echo
            echo "</details>"
            echo
            echo "### Street-cred (peers-only rank; lower = better)"
            echo "$STREET"
            echo
            echo "---"
            echo "_${STATUS} · ${COST_LINE} · models: ${MODELS} · ${SEATS_LINE}chair: ${CHAIR} · fail_on: ${FAIL_ON} · [evidence artifact](${RUN_URL}) · adjudicated council verdict_"
          } > comment.md
          EXISTING=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/${GH_REPO}/issues/comments/$EXISTING" -X PATCH -F body=@comment.md
          else
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@comment.md
          fi
