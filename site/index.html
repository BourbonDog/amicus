  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0D1117; }

    .pd-print-only { display: none; }
    @media print {
      .pd-no-print { display: none !important; }
      .pd-print-only { display: block !important; }
      .pd-collapsible { max-height: none !important; overflow: visible !important; }
      .pd-card, .pd-figure, figure, blockquote, .pd-stat, .pd-testimonial { break-inside: avoid; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { overflow: visible !important; height: auto !important; }
      @page { margin: 0.75in; }
    }
    html[data-pd-type="resume"] header { min-height: 0 !important; }
    html[data-pd-type="resume"] header h1 { font-size: clamp(2rem, 5vw, 3.5rem) !important; }
    html[data-pd-type="resume"] .hero-quote { display: none !important; }
    html[data-pd-type="resume"] .hero-main { grid-column: span 12 !important; }
    /* The "Scroll to explore" indicator is the last <div> child of the hero <header> and has no class of its own. */
    html[data-pd-type="resume"] header > div:last-of-type { display: none !important; }
    html[data-pd-type="resume"] .timeline-entry {
      grid-template-columns: 60px 1fr !important; min-height: auto !important;
      gap: 12px !important; opacity: 1 !important; transform: none !important;
    }
    html[data-pd-type="resume"] .timeline-left { display: none !important; }

function normalizeHex(hex) {
  let h = String(hex).trim().replace(/^#/, '');
  if (h.length === 3 || h.length === 4) {
    h = h.slice(0, 3).split('').map(c => c + c).join('');
  } else if (h.length >= 6) {
    h = h.slice(0, 6);
  } else {
    // Malformed short input (e.g. a 5-digit hex): pad to a valid 6-digit value.
    h = (h + '000000').slice(0, 6);
  }
  return '#' + h.toUpperCase();

    const bv = parseInt(b.slice(i, i + 2), 16);
    const mv = Math.round(av + (bv - av) * t);
    return Math.max(0, Math.min(255, mv)).toString(16).padStart(2, '0');
  }).join('');
  return '#' + out.toUpperCase();
}

  return mixHex(hex, '#FFFFFF', amount);
}

const parseTopicContent = content => {
  if (!content) return {
    intro: '',
    teachings: [],
    technologies: ''
  };

  // Split content by the main sections
  const parts = {
    intro: '',
    teachings: [],
    technologies: ''
  };

  // Find "What I Teach:" or "What John Teaches:" section
  const teachMatch = content.match(/\*\*What (?:I|John) Teach(?:es)?:\*\*\s*([\s\S]*?)(?=\*\*Technologies:\*\*|$)/i);
  const techMatch = content.match(/\*\*Technologies:\*\*\s*([\s\S]*?)$/i);

  // Everything before "What I Teach" is intro
  const introEnd = content.search(/\*\*What (?:I|John) Teach/i);
  if (introEnd > 0) {
    parts.intro = content.substring(0, introEnd).trim();
  } else if (!teachMatch && !techMatch) {
    parts.intro = content;
  }

  // Parse teachings - handle both bullet points (•) and inline format
  if (teachMatch) {
    const teachContent = teachMatch[1].trim();
    // Check if it has bullet points
    if (teachContent.includes('•')) {
      parts.teachings = teachContent.split('•').map(t => t.trim()).filter(t => t.length > 0);
    } else {
      // Single paragraph teaching description
      parts.teachings = [teachContent];
    }
  }

  // Parse technologies
  if (techMatch) {
    parts.technologies = techMatch[1].trim();
  }
  return parts;
};

"6\" fill=\"#555\">click</text>\n        </svg>\n        <h3>03 &middot; Fold</h3>\n        <p>Click Fold and a structured summary flows back into Claude. Findings, recommendations, decisions. No context switching, no noise.</p>\n      </div>\n    </div>\n  </div>\n\n  <!-- #swarm: animated SVG subagents section -->\n  <div class=\"w\" style=\"margin-top:4rem\">\n    <div class=\"tag rv\">Parallel Subagents</div>\n    <h2 class=\"rv\">Spawn Subagents.<br><span>Claude Orchestrates.</span></h2>\n    <p class=\"lead rv\">Amicus can also run headlessly as parallel subagents inside Claude Code or Cowork. Spawn multiple models at once. Each runs independently on its task. All results fold back into Claude.</p>\n    <div class=\"swarm-wrap\">\n      <div class=\"rv\">\n        <!-- Swarm SVG diagram -->\n        <svg class=\"swarm-svg\" viewBox=\"0 0 460 340\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto\">\n          <!-- Claude Code / Cowork - orchestrator at top -->\n          <rect x=\"130\" y=\"0\" width=\"200\" height=\"60\" rx=\"8\" fill=\"#111113\" stroke=\"#f5f5f3\" stroke-width=\"1.5\"/>\n          <circle cx=\"145\" cy=\"14\" r=\"3\" fill=\"#e25555\" opacity=\".6\"/><circle cx=\"154\" cy=\"14\" r=\"3\" fill=\"#e2a855\" opacity=\".6\"/><circle cx=\"163\" cy=\"14\" r=\"3\" fill=\"#55c255\" opacity=\".6\"/>\n          <text x=\"230\" y=\"17\" text-anchor=\"middle\" font-family=\"IBM Plex Mono,monospace\" font-size=\"7\" font-weight=\"600\" fill=\"#a1a1a0\">Claude Code / Cowork</text>\n          <text x=\"230\" y=\"38\" text-anchor=\"middle\" font-family=\"Outfit,sans-serif\" font-size=\"9.5\" font-weight=\"600\" fill=\"#f5f5f3\">Orchestrator</text>\n          <text x=\"230\" y=\"52\" text-anchor=\"middle\" font-family=\"IBM Plex Mono,monospace\" font-size=\"7\" fill=\"#555\">spawns headless Amicus instances</text>\n\n          <!-- Fork arrows down -->\n          <path class=\"fork1\" d=\"M180 60 L60 110\" stroke=\"#d97757\" str   function whenReady(cb){
    var root=document.getElementById('root');
    if(!root) return;
    if(root.children.length) return cb(root);
    var obs=new MutationObserver(function(){ if(root.children.length){ obs.disconnect(); cb(root); } });
    obs.observe(root,{childList:true,subtree:true});
    var n=0;(function poll(){ if(root.children.length) return; if(n++<120) requestAnimationFrame(poll); })();
  }
  function findHeading(re){
    var hs=document.querySelectorAll('#root h1,#root h2,#root h3');
    for(var i=0;i<hs.length;i++){ if(re.test(hs[i].textContent||'')) return hs[i].closest('section')||hs[i]; }
    return null;
  }
  whenReady(function(root){
    var content = root.querySelector(CFG.contentRootSelector) || root.firstElementChild || root;
    var ph = root.querySelector(CFG.headerPlaceholderSelector); if(ph) ph.remove();
    content.insertAdjacentHTML('afterbegin', DEMO);
    content.insertAdjacentHTML('afterbegin', HERO);
    var anchor = findHeading(new RegExp(CFG.modelAnchorRegex,'i'));
    if(anchor) anchor.insertAdjacentHTML('beforebegin', BADGES);
    else content.insertAdjacentHTML('beforeend', BADGES);
    if(window.__amicusRunDemo) try{ window.__amicusRunDemo(); }catch(e){ console.error('demo init', e); }
  });
})();
